    enlace: '<path d="M10.5 13.5a4 4 0 0 0 5.7 0l2.3-2.3a4 4 0 0 0-5.7-5.7l-1.2 1.2"/><path d="M13.5 10.5a4 4 0 0 0-5.7 0l-2.3 2.3a4 4 0 0 0 5.7 5.7l1.2-1.2"/>', // Enlace magico
    correo: '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3.5 7 8.5 6 8.5-6"/>', // Canal correo
    campanaOff: '<path d="M8.7 3.9A6 6 0 0 1 18 8c0 2.6.5 4.4 1.2 5.7"/><path d="M17 17H4s3-2 3-9c0-.5 0-1 .1-1.4"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/><path d="M2 2l20 20"/>', // Notificaciones silenciadas
    // "Bloqueado / en pausa" -- reemplaza el simbolo ⏸ (que en Windows sale
    // como emoji azul). Barras rellenas para que se lea a tamano chico.
    pausado: '<rect x="7" y="5" width="3.4" height="14" rx="1" fill="currentColor" stroke="none"/><rect x="13.6" y="5" width="3.4" height="14" rx="1" fill="currentColor" stroke="none"/>'
  };

  /**
   * @param {string} nombre clave de TRAZOS
   * @param {{tam?:number, clase?:string, titulo?:string}} [opciones]
   *        titulo: si se pasa, el icono se anuncia a lectores de pantalla;
   *        si no, se marca aria-hidden (es decorativo junto a un texto).
   */
  function svg(nombre, opciones) {
    var trazo = TRAZOS[nombre];
    if (!trazo) {
      return '';
    }
    var opts = opciones || {};
    var tam = opts.tam || 16;
    var accesible = opts.titulo
      ? ' role="img" aria-label="' + String(opts.titulo).replace(/"/g, '&quot;') + '"'
      : ' aria-hidden="true"';

    return '<svg class="sigso-ico' + (opts.clase ? ' ' + opts.clase : '') + '"' +
      ' width="' + tam + '" height="' + tam + '" viewBox="0 0 24 24"' + accesible + '>' +
      trazo + '</svg>';
  }

  return { svg: svg, TRAZOS: TRAZOS };
})();

</script>
  <script>
/**
 * navegacion.js — arquitectura de navegación de SIGSO (v12.0).
 *
 * PROBLEMA QUE RESUELVE
 * Cada módulo resolvía su navegación interna por su cuenta y casi siempre con
 * una barra horizontal de pestañas:
 *   - calidad.js       16 secciones en 7 grupos, en UNA barra con scroll lateral
 *   - proyectos.js      7 pestañas por proyecto
 *   - novedades.js      3-4 vistas
 *   - coordinacion.js   3 vistas
 *   - admin.js         14 ítems (ya vertical) + sub-pestañas dentro de Pausas
 * El propio CSS de Calidad dejó escrito el síntoma: "con la quinta sección la
 * barra dejó de caber en un móvil y estiraba la página entera". Hoy son 16.
 *
 * QUÉ HACE ESTE ARCHIVO
 * Da UNA sola forma de declarar y pintar la navegación interna de cualquier
 * módulo, con la jerarquía Módulo -> Submódulo -> Ítem, en vertical.
 *
 * LO QUE **NO** HACE, A PROPÓSITO
 *  - No decide permisos. Recibe un predicado `visible` y lo obedece. Quien
 *    manda sigue siendo el backend (en Calidad, seccionesVisiblesSgc_).
 *  - No conoce ningún módulo en particular. La arquitectura de cada uno se
 *    declara al llamar, o se registra en SigsoNav.registrar().
 *  - No navega solo: avisa por onSeleccion y el módulo decide qué pintar.
 *
 * REGLA DE PROFUNDIDAD
 * Un submódulo con UN solo ítem que se llama igual que él no se dibuja como
 * acordeón: se dibuja como un enlace directo. Tres niveles visibles siempre
 * serían más ruido que ayuda (§24 del encargo: "no sobrediseñar").
 */
(function () {
  'use strict';

  // Submódulo de Reportes: es transversal a todos los módulos y por eso su id
  // está fijado aquí y no lo elige cada módulo. Se dibuja destacado (§23).
  var ID_REPORTES = 'reportes';

  // Registro central de arquitecturas por módulo. Un módulo puede registrarse
  // aquí (compartido) o pasar sus submódulos directo en cada render.
  var registro_ = {};

  /**
   * Registra la arquitectura de un módulo.
   * @param {string} moduloId
   * @param {{nombre:string, submodulos:Array}} definicion
   */
  function registrar(moduloId, definicion) {
    registro_[moduloId] = definicion;
  }

  function obtener(moduloId) {
    return registro_[moduloId] || null;
  }

  /**
   * Separa un id de ítem compuesto: "documentos:PRO" -> {seccion, argumento}.
   * Permite que un submódulo tenga ítems que son VISTAS FILTRADAS de una misma
   * sección ya existente, sin duplicar pantallas ni inventar endpoints.
   */
  function partes(itemId) {
    var i = String(itemId || '').indexOf(':');
    if (i === -1) return { seccion: String(itemId || ''), argumento: '' };
    return {
      seccion: String(itemId).slice(0, i),
      argumento: String(itemId).slice(i + 1)
    };
  }

  function icono_(nombre, tam) {
    if (!nombre || !window.Iconos || !window.Iconos.svg) return '';
    return window.Iconos.svg(nombre, { tam: tam || 16 });
  }

  function esc_(texto) {
    return window.Componentes ? window.Componentes.escaparHtml(texto) : String(texto == null ? '' : texto);
  }

  /**
   * ¿Qué ítems de este submódulo puede ver la persona?
   * `visible` puede faltar (todo visible) o ser una función id -> bool.
   */
  function itemsVisibles_(sub, visible) {
    var items = sub.items || [];
    if (typeof visible !== 'function') return items.slice();
    return items.filter(function (it) {
      // El permiso puede declararse aparte del id: un ítem "documentos:PRO"
      // se rige por el permiso de "documentos", no por uno propio.
      var llave = it.permiso || partes(it.id).seccion;
      return visible(llave, it) !== false;
    });
  }

  /**
   * Un submódulo con un único ítem homónimo se aplana a enlace directo.
   * Ej.: "Inicio > Tablero" se dibuja solo como "Inicio".
   */
  function esPlano_(sub, items) {
    if (items.length !== 1) return false;
    if (sub.plano === false) return false;
    return sub.plano === true || items[0].nombre === sub.nombre;
  }

  function badgeHtml_(valor) {
    if (valor === undefined || valor === null || valor === '' || valor === 0) return '';
    return '<span class="sigso-nav2__badge">' + esc_(valor) + '</span>';
  }

  /**
   * Pinta la navegación vertical de un módulo dentro de `contenedor`.
   *
   * @param {Object} opts
   *   contenedor   {HTMLElement}  dónde pintar
   *   modulo       {string}       id del módulo (para data-attrs y registro)
   *   submodulos   {Array}        si falta, se toma del registro
   *   activo       {string}       id del ítem activo
   *   visible      {Function}     (llavePermiso, item) -> bool
   *   badges       {Object}       { itemId: valor }
   *   onSeleccion  {Function}     (itemId, item) -> void
   */
  function render(opts) {
    var cont = opts.contenedor;
    if (!cont) return;

    var def = opts.submodulos ? { submodulos: opts.submodulos } : obtener(opts.modulo);
    if (!def) { cont.innerHTML = ''; return; }

    var activo = opts.activo || '';
    var seccionActiva = partes(activo).seccion;
    var badges = opts.badges || {};

    // Sólo submódulos con al menos un ítem visible.
    var grupos = [];
    (def.submodulos || []).forEach(function (sub) {
      var items = itemsVisibles_(sub, opts.visible);
      if (!items.length) return;
      grupos.push({ sub: sub, items: items });
    });

    var html = grupos.map(function (g, indice) {
      var sub = g.sub;
      var items = g.items;
      // Un submódulo se abre si contiene el ítem activo. Es lo que hace que al
      // entrar por un enlace directo el usuario vea DÓNDE está parado.
      var contieneActivo = items.some(function (it) {
        return it.id === activo || partes(it.id).seccion === seccionActiva;
      });
      var destacado = sub.id === ID_REPORTES;

      if (esPlano_(sub, items)) {
        var it0 = items[0];
        var activoPlano = it0.id === activo;
        return '<div class="sigso-nav2__bloque' + (destacado ? ' sigso-nav2__bloque--destacado' : '') + '">' +
          '<button type="button" class="sigso-nav2__directo' + (activoPlano ? ' sigso-nav2__directo--activo' : '') + '"' +
            ' data-nav-item="' + esc_(it0.id) + '"' +
            (activoPlano ? ' aria-current="page"' : '') + '>' +
            '<span class="sigso-nav2__ico">' + icono_(sub.icono || it0.icono, 16) + '</span>' +
            '<span class="sigso-nav2__txt">' + esc_(sub.nombre) + '</span>' +
            badgeHtml_(badges[it0.id]) +
          '</button>' +
        '</div>';
      }

      var idPanel = 'nav2-' + esc_(opts.modulo || 'mod') + '-' + esc_(sub.id);
      return '<div class="sigso-nav2__bloque' + (destacado ? ' sigso-nav2__bloque--destacado' : '') + '">' +
        '<button type="button" class="sigso-nav2__cab' + (contieneActivo ? ' sigso-nav2__cab--abierto' : '') + '"' +
          ' data-nav-sub="' + esc_(sub.id) + '"' +
          ' aria-expanded="' + (contieneActivo ? 'true' : 'false') + '"' +
          ' aria-controls="' + idPanel + '">' +
          '<span class="sigso-nav2__ico">' + icono_(sub.icono, 16) + '</span>' +
          '<span class="sigso-nav2__txt">' + esc_(sub.nombre) + '</span>' +
          (sub.descripcion ? '<span class="sigso-nav2__desc">' + esc_(sub.descripcion) + '</span>' : '') +
          '<span class="sigso-nav2__chevron" aria-hidden="true"></span>' +
        '</button>' +
        '<ul class="sigso-nav2__items" id="' + idPanel + '" role="list"' +
            (contieneActivo ? '' : ' hidden') + '>' +
          items.map(function (it) {
            var esActivo = it.id === activo;
            return '<li>' +
              '<button type="button" class="sigso-nav2__item' + (esActivo ? ' sigso-nav2__item--activo' : '') + '"' +
                ' data-nav-item="' + esc_(it.id) + '"' +
                (esActivo ? ' aria-current="page"' : '') + '>' +
                '<span class="sigso-nav2__punto" aria-hidden="true"></span>' +
                '<span class="sigso-nav2__txt">' + esc_(it.nombre) + '</span>' +
                badgeHtml_(badges[it.id]) +
              '</button>' +
            '</li>';
          }).join('') +
        '</ul>' +
      '</div>';
    }).join('');

    cont.innerHTML = html;
    cont.setAttribute('data-nav-modulo', opts.modulo || '');

    // --- interacción ---------------------------------------------------------
    cont.querySelectorAll('[data-nav-sub]').forEach(function (cab) {
      cab.addEventListener('click', function () {
        var abierto = cab.getAttribute('aria-expanded') === 'true';
        var panel = document.getElementById(cab.getAttribute('aria-controls'));
        cab.setAttribute('aria-expanded', abierto ? 'false' : 'true');
        cab.classList.toggle('sigso-nav2__cab--abierto', !abierto);
        if (panel) panel.hidden = abierto;
      });
    });

    cont.querySelectorAll('[data-nav-item]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var id = btn.getAttribute('data-nav-item');
        if (typeof opts.onSeleccion === 'function') opts.onSeleccion(id, partes(id));
      });
    });
  }

  /**
   * Migas de pan. Devuelve el HTML de "SIGSO / Módulo / Submódulo / Ítem".
   * El último tramo NO es un botón: es donde estás.
   */
  function migas(opts) {
    var def = opts.submodulos ? { submodulos: opts.submodulos } : obtener(opts.modulo);
    // `ruta` es a dónde lleva el tramo. Sin ruta, el tramo es texto muerto.
    // Antes de la v12.1 TODOS eran texto muerto, porque no había enrutamiento
    // y no existía destino al que enlazar.
    var tramos = [{ texto: 'SIGSO', ruta: 'home' }];
    if (opts.moduloNombre) {
      tramos.push({ texto: opts.moduloNombre, ruta: opts.modulo });
    }

    if (def) {
      var activo = opts.activo || '';
      (def.submodulos || []).forEach(function (sub) {
        (sub.items || []).forEach(function (it) {
          if (it.id !== activo) return;
          // Un submódulo aplanado no aporta un tramo propio: sería repetir
          // el mismo nombre dos veces seguidas.
          // El submódulo NO lleva ruta: no es un destino, es una agrupación.
          // Enlazarlo al primero de sus ítems mentiría sobre a dónde va.
          if (!esPlano_(sub, sub.items || [])) tramos.push({ texto: sub.nombre });
          tramos.push({ texto: it.nombre, ruta: opts.modulo, item: it.id });
        });
      });
    }
    if (opts.detalle) tramos.push({ texto: opts.detalle });

    return '<nav class="sigso-migas" aria-label="Ruta de navegación"><ol>' +
      tramos.map(function (t, i) {
        var ultimo = i === tramos.length - 1;
        if (ultimo || !t.ruta) {
          return '<li>' + (ultimo
            ? '<span aria-current="page">' + esc_(t.texto) + '</span>'
            : '<span>' + esc_(t.texto) + '</span>') + '</li>';
        }
        // Un <a> con href real: se puede abrir en pestaña nueva, copiar el
        // enlace y usar con el teclado sin que haya que programar nada.
        var destino = '#/' + encodeURIComponent(t.ruta) +
          (t.item ? '/' + encodeURIComponent(t.item) : '');
        return '<li><a href="' + destino + '">' + esc_(t.texto) + '</a></li>';
      }).join('') +
      '</ol></nav>';
  }

  // ==========================================================================
  // ÁRBOL DE LA BARRA LATERAL (v13.0)
  //
  // CORRECCIÓN de la v12: la jerarquía Módulo > Submódulo > Ítem vivía en el
  // CONTENIDO (una columna de acordeones a la izquierda del panel). Debía
  // vivir en la BARRA AZUL. El contenido vuelve a ser sólo la pantalla
  // seleccionada, con su título, sus migas y sus acciones.
  //
  // Tres niveles y no más:
  //   1. Módulo    — lo que ya listaba el sidebar
  //   2. Submódulo — agrupa; se expande y colapsa
  //   3. Ítem      — la pantalla que se abre
  //
  // Un módulo SIN árbol registrado se dibuja como enlace simple, igual que
  // siempre (Nueva solicitud, Mis solicitudes, Pausas...). No se le inventa
  // una jerarquía que no tiene.
  //
  // El permiso lo sigue decidiendo cada módulo: registra un predicado
  // `visible` y el árbol lo obedece. Si un ítem no se puede ver, no se dibuja
  // -- y si un submódulo se queda sin ítems visibles, tampoco.

  // ACORDEÓN de una sola rama por módulo (bug real reportado: antes cada
  // rama era un boolean INDEPENDIENTE que, una vez abierto, no se volvía a
  // cerrar solo -- tras navegar un rato por Personas, Seguimiento, Medición
  // y El sistema, las cuatro quedaban abiertas a la vez aunque el usuario ya
  // estuviera en "Inicio", y el sidebar se veía "muy extenso"). Ahora se
  // guarda COMO MUCHO una rama abierta por módulo.
  //   - abiertoPorModulo_[modulo]: id de la rama abierta, o null si ninguna.
  //   - activoRecordado_[modulo]: último itemActivo visto, para notar
  //     cuándo la navegación se movió a otra parte.
  // Regla: si el ítem activo CAMBIÓ desde el último repintado, manda dónde
  // estás parado -- se abre la rama que lo contiene (o ninguna, si es un
  // ítem plano sin grupo, como "Inicio"), y la que estuviera abierta antes
  // se pliega. Si el ítem activo NO cambió (repintado por otro motivo, ej.
  // una badge), se respeta lo último que el usuario abrió o cerró a mano.
  var abiertoPorModulo_ = {};
  var activoRecordado_ = {};

  function estaAbierto_(modulo, sub) {
    return abiertoPorModulo_[modulo] === sub;
  }

  // Un clic en la cabecera de una rama es SIEMPRE exclusivo: abrirla pliega
  // cualquier otra del mismo módulo (y un segundo clic sobre la misma la
  // cierra, volviendo a "nada abierto") -- así se navega de a un nivel por
  // vez, como se pidió.
  function alternarAbierto_(modulo, sub) {
    abiertoPorModulo_[modulo] = (abiertoPorModulo_[modulo] === sub) ? null : sub;
    return abiertoPorModulo_[modulo] === sub;
  }

  /**
   * Ensambla el sidebar: agrupado si vienen grupos, plano si no.
   *
   * Agrupar tiene sentido con muchos modulos; con cuatro es ruido. Por eso el
   * shell decide si manda `grupos` o no, segun cuantos ve la cuenta. Un grupo
   * sin modulos visibles NO se dibuja: si el admin no le dio ninguno de esa
   * familia, el encabezado sobraria.
   *
   * Lo que no cae en ningun grupo va al final. Asi, agregar un modulo nuevo
   * sin acordarse de meterlo en un grupo NUNCA lo hace desaparecer del menu.
   */
  function ensamblar_(opts, htmlPorModulo) {
    var orden = (opts.modulos || []).map(function (m) { return m.id; });
    if (!opts.grupos || !opts.grupos.length) {
      return orden.map(function (id) { return htmlPorModulo[id] || ''; }).join('');
    }
    var usados = {};
    var html = opts.grupos.map(function (g) {
      var suyos = (g.modulos || []).filter(function (id) { return htmlPorModulo[id]; });
      if (!suyos.length) return '';
      suyos.forEach(function (id) { usados[id] = true; });
      return '<div class="plataforma-nav__grupo">' +
        (g.titulo ? '<p class="plataforma-nav__grupo-tit">' + esc_(g.titulo) + '</p>' : '') +
        suyos.map(function (id) { return htmlPorModulo[id]; }).join('') +
      '</div>';
    }).join('');
    var sueltos = orden.filter(function (id) { return htmlPorModulo[id] && !usados[id]; });
    return html + (sueltos.length
      ? '<div class="plataforma-nav__grupo">' + sueltos.map(function (id) { return htmlPorModulo[id]; }).join('') + '</div>'
      : '');
  }
  /**
   * Pinta el árbol completo de la barra lateral.
   *
   * @param {Object} opts
   *   contenedor    {HTMLElement}
   *   modulos       {Array}  [{id, nombre, icono, badge, esEnlace, href}]
   *   moduloActivo  {string}
   *   itemActivo    {string} id del ítem activo dentro del módulo activo
   *   onModulo      {Function} (moduloId) -> void
   *   onItem        {Function} (moduloId, itemId) -> void
   */
  function renderArbol(opts) {
    var cont = opts.contenedor;
    if (!cont) return;
    var moduloActivo = opts.moduloActivo || '';
    var itemActivo = opts.itemActivo || '';

    // v13.1: se construye el HTML de cada modulo y DESPUES se ensambla,
    // agrupado o plano. Antes se concatenaba directo y no habia donde meter
    // los encabezados de grupo.
    var htmlPorModulo = {};
    (opts.modulos || []).forEach(function (m) {
      var def = obtener(m.id);
      var esExpandible = !!(def && (def.submodulos || []).length);
      var abiertoModulo = m.id === moduloActivo;

      // --- Nivel 1: el módulo ---
      var badge = (m.badge !== undefined && m.badge !== null && m.badge !== '' && m.badge !== 0)
        ? '<span class="plataforma-nav__badge" data-badge="' + esc_(m.id) + '">' + esc_(m.badge) + '</span>'
        : '<span class="plataforma-nav__badge sigso-oculto" data-badge="' + esc_(m.id) + '"></span>';

      var cabecera;
      if (m.esEnlace && m.href) {
        // Módulo externo: sigue siendo un <a>, como antes.
        cabecera = '<a class="plataforma-nav__item" href="' + esc_(m.href) + '"' +
          ' target="_blank" rel="noopener"' + (m.acento || '') + '>' +
          '<span class="plataforma-nav__ico">' + icono_(m.icono, 18) + '</span>' +
          '<span class="plataforma-nav__etiqueta">' + esc_(m.nombre) + '</span></a>';
      } else {
        cabecera = '<button type="button" class="plataforma-nav__item' +
            (abiertoModulo ? ' plataforma-nav__item--activo' : '') +
            (esExpandible ? ' plataforma-nav__item--rama' : '') + '"' +
          ' data-modulo="' + esc_(m.id) + '"' + (m.acento || '') +
          (esExpandible ? ' aria-expanded="' + (abiertoModulo ? 'true' : 'false') + '"' : '') + '>' +
          '<span class="plataforma-nav__ico">' + icono_(m.icono, 18) + '</span>' +
          '<span class="plataforma-nav__etiqueta">' + esc_(m.nombre) + '</span>' +
          badge +
          (esExpandible ? '<span class="plataforma-nav__chevron" aria-hidden="true"></span>' : '') +
        '</button>';
      }

      if (!esExpandible || !abiertoModulo) { htmlPorModulo[m.id] = cabecera; return; }

      // --- Nivel 2 y 3: sólo del módulo abierto ---
      var visible = def.visible;
      var subsConItems = (def.submodulos || []).map(function (sub) {
        return { sub: sub, items: itemsVisibles_(sub, visible) };
      }).filter(function (x) { return x.items.length > 0; });

      // Acordeón de una sola rama (ver abiertoPorModulo_ arriba): si el
      // ítem activo cambió desde el último repintado de ESTE módulo, la
      // rama que lo contiene manda -- se abre esa y se pliega cualquier
      // otra. Si no cambió, se respeta lo último que el usuario abrió o
      // cerró a mano (ej. está mirando "Inicio" pero abrió "Personas" para
      // curiosear, sin haber hecho clic en ningún ítem todavía).
      if (activoRecordado_[m.id] !== itemActivo) {
        activoRecordado_[m.id] = itemActivo;
        var grupoDelActivo = null;
        subsConItems.forEach(function (x) {
          if (esPlano_(x.sub, x.items)) return;
          if (x.items.some(function (it) { return it.id === itemActivo; })) grupoDelActivo = x.sub.id;
        });
        abiertoPorModulo_[m.id] = grupoDelActivo;
      }

      var ramas = subsConItems.map(function (x) {
        var sub = x.sub;
        var items = x.items;

        // Un submódulo de un solo ítem homónimo (o marcado plano) no se
        // dibuja como rama que hay que abrir para encontrar una sola cosa:
        // va directo como hoja de nivel 2.
        if (esPlano_(sub, items)) {
          var it0 = items[0];
          return '<button type="button" class="plataforma-nav__sub plataforma-nav__hoja' +
              (it0.id === itemActivo ? ' plataforma-nav__sub--activo' : '') +
              (sub.id === ID_REPORTES ? ' plataforma-nav__sub--reportes' : '') + '"' +
            ' data-item="' + esc_(it0.id) + '" data-de-modulo="' + esc_(m.id) + '"' +
            (it0.id === itemActivo ? ' aria-current="page"' : '') + '>' +
            '<span class="plataforma-nav__etiqueta">' + esc_(sub.nombre) + '</span>' +
          '</button>';
        }

        var abierto = estaAbierto_(m.id, sub.id);
        var idLista = 'arbol-' + esc_(m.id) + '-' + esc_(sub.id);
        return '<button type="button" class="plataforma-nav__sub' +
            (abierto ? ' plataforma-nav__sub--abierto' : '') +
            (sub.id === ID_REPORTES ? ' plataforma-nav__sub--reportes' : '') + '"' +
          ' data-sub="' + esc_(sub.id) + '" data-de-modulo="' + esc_(m.id) + '"' +
          ' aria-expanded="' + (abierto ? 'true' : 'false') + '" aria-controls="' + idLista + '">' +
          '<span class="plataforma-nav__etiqueta">' + esc_(sub.nombre) + '</span>' +
          '<span class="plataforma-nav__chevron" aria-hidden="true"></span>' +
        '</button>' +
        '<div class="plataforma-nav__items" id="' + idLista + '"' + (abierto ? '' : ' hidden') + '>' +
          items.map(function (it) {
            return '<button type="button" class="plataforma-nav__hoja' +
                (it.id === itemActivo ? ' plataforma-nav__hoja--activo' : '') + '"' +
              ' data-item="' + esc_(it.id) + '" data-de-modulo="' + esc_(m.id) + '"' +
              (it.id === itemActivo ? ' aria-current="page"' : '') + '>' +
              '<span class="plataforma-nav__punto" aria-hidden="true"></span>' +
              '<span class="plataforma-nav__etiqueta">' + esc_(it.nombre) + '</span>' +
            '</button>';
          }).join('') +
        '</div>';
      }).join('');

      htmlPorModulo[m.id] = cabecera + '<div class="plataforma-nav__rama">' + ramas + '</div>';
    });

    // Repintar con innerHTML tira el DOM entero, y con el se van dos cosas
    // que el usuario SI nota: donde tenia scrolleado el menu (si esta abajo
    // en Calidad, el arbol saltaba arriba en cada clic) y que boton tenia
    // enfocado con el teclado. Se guardan y se reponen.
    var scrollPrevio = cont.scrollTop;
    var enfocado = document.activeElement;
    var refFoco = (enfocado && cont.contains(enfocado))
      ? (enfocado.getAttribute('data-item') ? 'item:' + enfocado.getAttribute('data-item')
        : enfocado.getAttribute('data-sub') ? 'sub:' + enfocado.getAttribute('data-sub')
        : enfocado.getAttribute('data-modulo') ? 'modulo:' + enfocado.getAttribute('data-modulo') : null)
      : null;

    cont.innerHTML = ensamblar_(opts, htmlPorModulo);
    cont.scrollTop = scrollPrevio;
    if (refFoco) {
      var partes_ = refFoco.split(':');
      var attr = partes_.shift();
      var valor = partes_.join(':');
      var destino = cont.querySelector('[data-' + attr + '="' + valor.replace(/"/g, '\\"') + '"]');
      if (destino) destino.focus();
    }

    // --- interacción ---------------------------------------------------------
    cont.querySelectorAll('[data-modulo]').forEach(function (b) {
      b.addEventListener('click', function () {
        if (typeof opts.onModulo === 'function') opts.onModulo(b.getAttribute('data-modulo'));
      });
    });
    cont.querySelectorAll('[data-sub]').forEach(function (b) {
      b.addEventListener('click', function () {
        // Acordeón exclusivo: repinta el árbol ENTERO (no solo este botón)
        // porque abrir esta rama tiene que plegar cualquier otra del mismo
        // módulo -- un parche local a un solo <ul> no alcanza para eso.
        alternarAbierto_(b.getAttribute('data-de-modulo'), b.getAttribute('data-sub'));
        renderArbol(opts);
      });
    });
    cont.querySelectorAll('[data-item]').forEach(function (b) {
      b.addEventListener('click', function () {
        if (typeof opts.onItem === 'function') {
          opts.onItem(b.getAttribute('data-de-modulo'), b.getAttribute('data-item'));
        }
      });
    });
  }

  // ==========================================================================
  // RUTAS (v12.1)
  //
  // Hasta la v12.0 SIGSO no tenia enrutamiento: los modulos se mostraban y
  // ocultaban con clases, y plataforma.js borraba la URL con replaceState. Eso
  // dejaba tres cosas rotas que nadie podia arreglar desde la UI:
  //   - no habia forma de compartir un enlace a una seccion;
  //   - el boton ATRAS del navegador sacaba al usuario de SIGSO entero;
  //   - las migas de pan no podian ser clicables, porque no habia destino.
  //
  // Formato:  #/<modulo>            ->  #/calidad
  //           #/<modulo>/<itemId>   ->  #/calidad/documentos:PRO
  //
  // Se usa HASH y no History API a proposito: SIGSO se publica en GitHub
  // Pages, que sirve archivos estaticos. Con pushState, recargar en
  // /plataforma/calidad daria 404 porque no hay servidor que reescriba.
  var RUTA_SILENCIO = false;

  function leerRuta() {
    var h = String(window.location.hash || '').replace(new RegExp('^#/?'), '');
    if (!h) return { modulo: '', item: '' };
    var trozos = h.split('/');
    return {
      modulo: decodeURIComponent(trozos[0] || ''),
      // El item puede traer ':' (documentos:PRO); se rearma por si el split
      // lo partio en mas trozos de la cuenta.
      item: decodeURIComponent(trozos.slice(1).join('/') || '')
    };
  }

  // Escribe la ruta SIN disparar el manejador de hashchange: quien llama ya
  // esta navegando, y volver a navegar por el evento seria un bucle.
  function escribirRuta(modulo, item, reemplazar) {
    var destino = '#/' + encodeURIComponent(modulo || '') +
      (item ? '/' + encodeURIComponent(item) : '');
    if (window.location.hash === destino) return;
    RUTA_SILENCIO = true;
    try {
      // replaceState para los cambios que NO son navegacion del usuario (p.ej.
      // restaurar la seccion por defecto al entrar): asi el boton atras no
      // acumula pasos que el usuario nunca dio.
      if (reemplazar && window.history && window.history.replaceState) {
        window.history.replaceState(null, '', window.location.pathname + window.location.search + destino);
      } else {
        window.location.hash = destino;
      }
    } finally {
      // El evento hashchange llega en el siguiente tick, no de inmediato.
      setTimeout(function () { RUTA_SILENCIO = false; }, 0);
    }
  }

  function alCambiarRuta(fn) {
    window.addEventListener('hashchange', function () {
      if (RUTA_SILENCIO) return;   // lo escribimos nosotros, no el usuario
      fn(leerRuta());
    });
  }

  window.SigsoRutas = {
    leer: leerRuta,
    escribir: escribirRuta,
    alCambiar: alCambiarRuta
  };

  window.SigsoNav = {
    ID_REPORTES: ID_REPORTES,
    registrar: registrar,
    obtener: obtener,
    partes: partes,
    render: render,
    renderArbol: renderArbol,
    migas: migas
  };
})();

</script>
  <!-- v12.2: motor de reportes (catalogo, filtros, exportacion y piezas
       visuales) compartido por todos los modulos. -->
  <script>
/**
 * reportes.js — motor de reportes de SIGSO (v12.2, Fase 2 del encargo).
 *
 * QUÉ RESUELVE
 * Hasta la v12.1, "Reportes" era un submódulo con un catálogo declarativo que
 * vivía dentro de calidad.js. Funcionaba, pero cada módulo que quisiera
 * reportes tendría que reescribir lo mismo: el catálogo, los filtros, la
 * exportación y las piezas visuales.
 *
 * Este archivo es esa base compartida. NO trae reportes: trae con qué
 * construirlos.
 *
 * LAS TRES REGLAS QUE LO ORDENAN
 *
 * 1. UN REPORTE DECLARA DE QUÉ DATO REAL SALE.
 *    Si el dato no existe todavía, el reporte aparece igual pero marcado
 *    PENDIENTE y diciendo qué le falta. Nunca se dibuja un gráfico con datos
 *    inventados para llenar la pantalla: en un SGC lo que se muestra es
 *    evidencia frente a un auditor, y un reporte que miente es peor que uno
 *    que falta.
 *
 * 2. SÓLO SE MUESTRAN LOS FILTROS QUE APLICAN.
 *    Cada reporte declara sus filtros. Un selector de "área" en un reporte
 *    que no desagrega por área no es neutro: promete un corte que no existe.
 *
 * 3. NO DECIDE PERMISOS.
 *    Igual que navegacion.js: recibe un predicado y lo obedece. El backend
 *    sigue siendo quien manda.
 *
 * DEPENDENCIAS: ninguna externa. Las tendencias y los rankings se dibujan con
 * SVG inline y CSS, no con Chart.js -- así el motor funciona también en
 * admin.html, que no carga la librería.
 */
(function () {
  'use strict';

  // --- Tipos de reporte (§13 del encargo) ------------------------------------
  // El tipo NO es decorativo: determina qué filtros tienen sentido por defecto
  // y con qué pieza visual se dibuja el resultado.
  var TIPOS = {
    ESTADO: { etiqueta: 'Estado', filtros: ['periodo', 'area', 'responsable', 'estado'] },
    CUMPLIMIENTO: { etiqueta: 'Cumplimiento', filtros: ['periodo', 'area', 'responsable'] },
    TENDENCIA: { etiqueta: 'Tendencia', filtros: ['desde', 'hasta', 'area'] },
    COMPARACION: { etiqueta: 'Comparación', filtros: ['periodo', 'periodo_previo', 'area'] },
    RANKING: { etiqueta: 'Ranking', filtros: ['periodo', 'dimension'] },
    DETALLE: { etiqueta: 'Detalle', filtros: ['periodo', 'area', 'responsable', 'estado'] }
  };

  var ETIQUETA_ESTADO = {
    LISTO: 'Disponible',
    SIN_DATOS: 'Sin datos aún',
    PENDIENTE: 'Requiere desarrollo'
  };
  var TONO_ESTADO = { LISTO: 'ok', SIN_DATOS: 'alerta', PENDIENTE: 'neutro' };

  var registro_ = {};

  function esc_(t) {
    return window.Componentes ? window.Componentes.escaparHtml(t) : String(t == null ? '' : t);
  }
  function icono_(n, tam) {
    if (!n || !window.Iconos || !window.Iconos.svg) return '';
    return window.Iconos.svg(n, { tam: tam || 16 });
  }

  /**
   * Registra el catálogo de reportes de un módulo.
   * @param {string} moduloId
   * @param {{grupos:Array, abrir:Function}} definicion
   *   grupos: [{ grupo, icono, reportes: [{id,nombre,tipo,estado,desc,fuente,falta,filtros,seccion}] }]
   *   abrir:  function (reporteId, filtros, contenedor) -> pinta el reporte
   */
  function registrar(moduloId, definicion) {
    registro_[moduloId] = definicion;
  }

  function obtener(moduloId) { return registro_[moduloId] || null; }

  function buscarReporte(moduloId, reporteId) {
    var def = obtener(moduloId);
    if (!def) return null;
    var hallado = null;
    (def.grupos || []).forEach(function (g) {
      (g.reportes || []).forEach(function (r) { if (r.id === reporteId) hallado = r; });
    });
    return hallado;
  }

  // ==========================================================================
  // CATÁLOGO
  // ==========================================================================
  function pintarCatalogo(opts) {
    var cont = opts.contenedor;
    var def = obtener(opts.modulo);
    if (!cont || !def) return;

    var listos = 0, total = 0;
    (def.grupos || []).forEach(function (g) {
      (g.reportes || []).forEach(function (r) {
        if (typeof opts.visible === 'function' && opts.visible(r) === false) return;
        total++;
        if (r.estado === 'LISTO') listos++;
      });
    });

    cont.innerHTML =
      (opts.encabezado || '') +
      '<div class="sgc-cabecera"><div>' +
        '<h2>' + esc_(def.titulo || 'Centro de reportes') + '</h2>' +
        '<p class="sigso-ayuda">' + listos + ' de ' + total + ' reportes se arman hoy con datos reales ' +
        'del sistema; el resto dice qué le falta.</p>' +
      '</div></div>' +
      (def.nota ? window.Componentes.alerta(def.nota, 'info') : '') +
      (def.grupos || []).map(function (g) {
        var reportes = (g.reportes || []).filter(function (r) {
          return typeof opts.visible !== 'function' || opts.visible(r) !== false;
        });
        if (!reportes.length) return '';
        return '<section class="sgc-rep-grupo">' +
          '<h3 class="sgc-rep-grupo__tit">' + icono_(g.icono, 16) +
            '<span>' + esc_(g.grupo) + '</span></h3>' +
          '<div class="sgc-rep-lista">' + reportes.map(tarjeta_).join('') + '</div>' +
        '</section>';
      }).join('');

    cont.querySelectorAll('[data-reporte]').forEach(function (card) {
      function abrir() {
        var id = card.getAttribute('data-reporte');
        var seccion = card.getAttribute('data-seccion');
        // Un reporte que ya vive dentro de una sección no se duplica: se
        // navega a ella. Duplicarlo sería crear la segunda versión de algo
        // que ya existe.
        if (seccion && typeof opts.onIrASeccion === 'function') { opts.onIrASeccion(seccion); return; }
        if (typeof opts.onAbrir === 'function') opts.onAbrir(id);
      }
      card.addEventListener('click', abrir);
      card.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); abrir(); }
      });
    });
  }

  function tarjeta_(r) {
    var accionable = r.estado === 'LISTO';
    var tipo = TIPOS[r.tipo];
    return '<article class="sgc-rep-card' + (accionable ? ' sgc-rep-card--activa' : '') + '"' +
        (accionable ? ' tabindex="0" role="button" data-reporte="' + esc_(r.id) + '"' +
          ' data-seccion="' + esc_(r.seccion || '') + '"' : '') + '>' +
      '<div class="sgc-rep-card__cab">' +
        '<h4>' + esc_(r.nombre) + '</h4>' +
        window.Componentes.badge(ETIQUETA_ESTADO[r.estado], TONO_ESTADO[r.estado]) +
      '</div>' +
      (tipo ? '<span class="sgc-rep-card__tipo">' + esc_(tipo.etiqueta) + '</span>' : '') +
      '<p class="sgc-rep-card__desc">' + esc_(r.desc) + '</p>' +
      (r.falta
        ? '<p class="sgc-rep-card__falta"><strong>Falta:</strong> ' + esc_(r.falta) + '</p>'
        : '<p class="sgc-rep-card__fuente">Sale de: <code>' + esc_(r.fuente || '') + '</code></p>') +
    '</article>';
  }

  // ==========================================================================
  // FILTROS
  // ==========================================================================
  // Sólo se dibujan los que el reporte declara. Cada uno sabe qué opciones
  // ofrecer; las dinámicas (áreas, responsables) las provee el módulo.
  // Traduce los filtros aplicados a { etiqueta, valor } legibles, para la
  // cabecera del documento. Reusa el mismo mapa que dibuja el formulario:
  // si mañana cambia el nombre visible de un filtro, cambia en los dos
  // lados a la vez o en ninguno.
  var ETIQUETAS_FILTRO = {
    periodo: 'Período', periodo_previo: 'Comparado con', desde: 'Desde', hasta: 'Hasta',
    area: 'Área', responsable: 'Responsable', estado: 'Estado',
    dimension: 'Agrupado por', proceso: 'Proceso'
  };

  function filtrosParaCabecera(reporte, opciones, valores) {
    valores = valores || {};
    opciones = opciones || {};
    var lista = (reporte && (reporte.filtros || (TIPOS[reporte.tipo] || {}).filtros)) || [];
    return lista.map(function (nombre) {
      var bruto = valores[nombre];
      if (bruto === undefined || bruto === null || bruto === '') return null;
      // El valor guardado es el de la opción; en el documento tiene que
      // aparecer el texto que la persona vio en pantalla.
      var catalogo = opciones[nombre] || (nombre === 'periodo' || nombre === 'periodo_previo' ? PERIODOS_POR_DEFECTO : []);
      var elegida = (catalogo || []).filter(function (o) {
        return String(o && o.valor !== undefined ? o.valor : o) === String(bruto);
      })[0];
      var texto = elegida && elegida.texto !== undefined ? elegida.texto : bruto;
      return { etiqueta: ETIQUETAS_FILTRO[nombre] || nombre, valor: texto };
    }).filter(Boolean);
  }
  function pintarFiltros(reporte, opciones, valores) {
    var lista = reporte.filtros || (TIPOS[reporte.tipo] || {}).filtros || [];
    if (!lista.length) return '';
    valores = valores || {};
    opciones = opciones || {};

    var campos = lista.map(function (f) {
      if (f === 'periodo') return select_('periodo', 'Período', opciones.periodo || PERIODOS_POR_DEFECTO, valores.periodo);
      if (f === 'periodo_previo') return select_('periodo_previo', 'Comparar con', opciones.periodo || PERIODOS_POR_DEFECTO, valores.periodo_previo);
      if (f === 'desde') return fecha_('desde', 'Desde', valores.desde);
      if (f === 'hasta') return fecha_('hasta', 'Hasta', valores.hasta);
      if (f === 'area') return select_('area', 'Área', opciones.area || [], valores.area, 'Todas');
      if (f === 'responsable') return select_('responsable', 'Responsable', opciones.responsable || [], valores.responsable, 'Todos');
      if (f === 'estado') return select_('estado', 'Estado', opciones.estado || [], valores.estado, 'Todos');
      if (f === 'dimension') return select_('dimension', 'Agrupar por', opciones.dimension || [], valores.dimension);
      if (f === 'proceso') return select_('proceso', 'Proceso', opciones.proceso || [], valores.proceso, 'Todos');
      return '';
    }).filter(Boolean).join('');

    return '<form class="sigso-rep-filtros" id="rep-filtros">' + campos +
      '<button type="submit" class="sigso-boton sigso-boton--secundario">Aplicar</button>' +
      '</form>';
  }

  var PERIODOS_POR_DEFECTO = [
    { valor: 'mes', texto: 'Este mes' },
    { valor: 'trimestre', texto: 'Este trimestre' },
    { valor: 'anio', texto: 'Este año' },
    { valor: 'todo', texto: 'Todo' }
  ];

  function select_(nombre, etiqueta, opciones, valor, textoVacio) {
    var opts = (textoVacio ? '<option value="">' + esc_(textoVacio) + '</option>' : '') +
      (opciones || []).map(function (o) {
        var v = o.valor !== undefined ? o.valor : o;
        var t = o.texto !== undefined ? o.texto : o;
        return '<option value="' + esc_(v) + '"' + (String(v) === String(valor || '') ? ' selected' : '') + '>' +
          esc_(t) + '</option>';
      }).join('');
    return '<label class="sigso-rep-filtro"><span>' + esc_(etiqueta) + '</span>' +
      '<select name="' + esc_(nombre) + '">' + opts + '</select></label>';
  }

  function fecha_(nombre, etiqueta, valor) {
    return '<label class="sigso-rep-filtro"><span>' + esc_(etiqueta) + '</span>' +
      '<input type="date" name="' + esc_(nombre) + '" value="' + esc_(valor || '') + '"></label>';
  }

  function leerFiltros(contenedor) {
    var form = contenedor.querySelector('#rep-filtros');
    if (!form) return {};
    var out = {};
    Array.prototype.forEach.call(form.elements, function (el) {
      if (el.name) out[el.name] = el.value;
    });
    return out;
  }

  function alAplicarFiltros(contenedor, fn) {
    var form = contenedor.querySelector('#rep-filtros');
    if (!form) return;
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      fn(leerFiltros(contenedor));
    });
  }

  // ==========================================================================
  // PIEZAS VISUALES
  // ==========================================================================

  /** Fila de KPIs. Reusa Componentes.kpi para no inventar un segundo estilo. */
  function kpis(lista) {
    if (!lista || !lista.length) return '';
    return '<div class="sgc-kpis">' + lista.map(function (k) {
      return window.Componentes.kpi(k);
    }).join('') + '</div>';
  }

  /**
   * Tabla con exportación. `columnas` = [{campo, titulo, alinear}].
   * Se declara la tabla una vez y de ahí sale el CSV: así lo exportado es
   * exactamente lo que se ve, y no una segunda consulta que podría diferir.
   */
  function tabla(columnas, filas, opts) {
    opts = opts || {};
    if (!filas || !filas.length) {
      return window.Componentes.vacio(opts.vacio || 'No hay datos para este corte.');
    }
    var id = opts.id || 'rep-tabla';
    return '<div class="sigso-rep-tabla-caja">' +
      '<table class="sigso-tabla" id="' + esc_(id) + '"><thead><tr>' +
        columnas.map(function (c) {
          return '<th' + (c.alinear === 'derecha' ? ' class="sigso-rep-num"' : '') + '>' + esc_(c.titulo) + '</th>';
        }).join('') +
      '</tr></thead><tbody>' +
        filas.map(function (f) {
          return '<tr>' + columnas.map(function (c) {
            var v = f[c.campo];
            return '<td' + (c.alinear === 'derecha' ? ' class="sigso-rep-num"' : '') + '>' +
              (c.html ? (v == null ? '' : v) : esc_(v == null ? '' : v)) + '</td>';
          }).join('') + '</tr>';
        }).join('') +
      '</tbody></table></div>';
  }

  /**
   * Ranking: barras horizontales en CSS puro. El ancho es proporcional al
   * máximo, y el valor va SIEMPRE escrito -- una barra sin número obliga a
   * estimar a ojo, que es justo lo que un reporte no debe pedir.
   */
  function ranking(filas, opts) {
    opts = opts || {};
    if (!filas || !filas.length) {
      return window.Componentes.vacio(opts.vacio || 'No hay datos para este ranking.');
    }
    var max = filas.reduce(function (m, f) { return Math.max(m, Number(f.valor) || 0); }, 0) || 1;
    return '<ol class="sigso-rep-ranking">' + filas.map(function (f, i) {
      var pct = Math.round((Number(f.valor) || 0) / max * 100);
      return '<li class="sigso-rep-ranking__fila">' +
        '<span class="sigso-rep-ranking__pos">' + (i + 1) + '</span>' +
        '<span class="sigso-rep-ranking__etq">' + esc_(f.etiqueta) + '</span>' +
        '<span class="sigso-rep-ranking__barra"><span style="width:' + pct + '%"></span></span>' +
        '<span class="sigso-rep-ranking__val">' + esc_(f.texto !== undefined ? f.texto : f.valor) + '</span>' +
      '</li>';
    }).join('') + '</ol>';
  }

  /**
   * Serie temporal en SVG inline. `puntos` = [{etiqueta, valor}].
   * SVG y no Chart.js para que el motor sirva también donde la librería no
   * está cargada (admin.html), y para que el reporte se imprima bien.
   */
  function tendencia(puntos, opts) {
    opts = opts || {};
    if (!puntos || puntos.length < 2) {
      return window.Componentes.vacio(opts.vacio ||
        'Hacen falta al menos dos períodos medidos para dibujar una tendencia.');
    }
    var an = 640, al = 180, m = { i: 44, d: 12, s: 16, b: 28 };
    var valores = puntos.map(function (p) { return Number(p.valor) || 0; });
    var max = Math.max.apply(null, valores);
    var min = Math.min.apply(null, valores);
    if (max === min) { max = max + 1; min = Math.max(0, min - 1); }
    var ax = an - m.i - m.d, ay = al - m.s - m.b;
    var x = function (i) { return m.i + (puntos.length === 1 ? ax / 2 : (i / (puntos.length - 1)) * ax); };
    var y = function (v) { return m.s + ay - ((v - min) / (max - min)) * ay; };

    var linea = puntos.map(function (p, i) {
      return (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(Number(p.valor) || 0).toFixed(1);
    }).join(' ');

    var meta = opts.meta !== undefined && opts.meta !== null && opts.meta !== ''
      ? '<line x1="' + m.i + '" y1="' + y(Number(opts.meta)).toFixed(1) + '" x2="' + (an - m.d) +
        '" y2="' + y(Number(opts.meta)).toFixed(1) + '" class="sigso-rep-meta"/>' +
        '<text x="' + (an - m.d) + '" y="' + (y(Number(opts.meta)) - 4).toFixed(1) +
        '" class="sigso-rep-meta-txt" text-anchor="end">meta ' + esc_(opts.meta) + '</text>'
      : '';

    return '<figure class="sigso-rep-tendencia">' +
      '<svg viewBox="0 0 ' + an + ' ' + al + '" role="img" aria-label="' +
        esc_(opts.titulo || 'Serie temporal') + '">' +
        '<line x1="' + m.i + '" y1="' + m.s + '" x2="' + m.i + '" y2="' + (m.s + ay) + '" class="sigso-rep-eje"/>' +
        '<line x1="' + m.i + '" y1="' + (m.s + ay) + '" x2="' + (an - m.d) + '" y2="' + (m.s + ay) + '" class="sigso-rep-eje"/>' +
        '<text x="' + (m.i - 6) + '" y="' + (m.s + 4) + '" class="sigso-rep-tick" text-anchor="end">' + esc_(max) + '</text>' +
        '<text x="' + (m.i - 6) + '" y="' + (m.s + ay) + '" class="sigso-rep-tick" text-anchor="end">' + esc_(min) + '</text>' +
        meta +
        '<path d="' + linea + '" class="sigso-rep-linea"/>' +
        puntos.map(function (p, i) {
          return '<circle cx="' + x(i).toFixed(1) + '" cy="' + y(Number(p.valor) || 0).toFixed(1) +
            '" r="3.5" class="sigso-rep-punto"><title>' + esc_(p.etiqueta) + ': ' + esc_(p.valor) + '</title></circle>';
        }).join('') +
        puntos.map(function (p, i) {
          // Con muchos períodos las etiquetas se pisan: se muestra una de cada N.
          var salto = Math.ceil(puntos.length / 8);
          if (i % salto !== 0 && i !== puntos.length - 1) return '';
          return '<text x="' + x(i).toFixed(1) + '" y="' + (al - 8) + '" class="sigso-rep-tick" text-anchor="middle">' +
            esc_(p.etiqueta) + '</text>';
        }).join('') +
      '</svg>' +
      // La tabla es la versión accesible del gráfico: un lector de pantalla no
      // puede leer un <path>, y además permite exportar lo mismo que se ve.
      '<figcaption class="sigso-rep-tendencia__pie">' +
        puntos.map(function (p) { return esc_(p.etiqueta) + ': ' + esc_(p.valor); }).join(' · ') +
      '</figcaption>' +
    '</figure>';
  }

  /**
   * Comparación de dos períodos. Muestra ambos valores y la variación, con
   * el signo escrito -- el color solo no basta (§20 del encargo).
   */
  function comparacion(filas, opts) {
    opts = opts || {};
    if (!filas || !filas.length) {
      return window.Componentes.vacio(opts.vacio || 'No hay datos para comparar.');
    }
    return '<table class="sigso-tabla sigso-rep-comparacion"><thead><tr>' +
      '<th>' + esc_(opts.dimension || 'Concepto') + '</th>' +
      '<th class="sigso-rep-num">' + esc_(opts.etiquetaPrevio || 'Período anterior') + '</th>' +
      '<th class="sigso-rep-num">' + esc_(opts.etiquetaActual || 'Período actual') + '</th>' +
      '<th class="sigso-rep-num">Variación</th>' +
      '</tr></thead><tbody>' +
      filas.map(function (f) {
        var a = Number(f.previo) || 0, b = Number(f.actual) || 0;
        var d = b - a;
        // "mejor" invierte el sentido: en "no conformidades abiertas" bajar es bueno.
        var bueno = opts.menosEsMejor ? d < 0 : d > 0;
        var tono = d === 0 ? 'neutro' : (bueno ? 'ok' : 'critico');
        var signo = d > 0 ? '+' : (d < 0 ? '−' : '=');
        return '<tr>' +
          '<td>' + esc_(f.etiqueta) + '</td>' +
          '<td class="sigso-rep-num">' + esc_(a) + '</td>' +
          '<td class="sigso-rep-num">' + esc_(b) + '</td>' +
          '<td class="sigso-rep-num"><span class="sigso-rep-var sigso-rep-var--' + tono + '">' +
            signo + ' ' + esc_(Math.abs(d)) + '</span></td>' +
        '</tr>';
      }).join('') +
      '</tbody></table>';
  }

  // ==========================================================================
  // CUMPLIMIENTO SOBRE ÍTEMS CON FECHA (v12.4)
  //
  // Se promueve al motor porque Gerencia y Jefatura la necesitan igual, y
  // porque la REGLA de qué se cuenta no debe poder divergir entre módulos:
  // si un panel midiera distinto que el otro, los dos números serían
  // sospechosos y no habría forma de saber cuál creer.
  //
  // LA REGLA: el cumplimiento se mide SOLO sobre lo entregado CON fecha
  // comprometida. Un ítem sin comprometer no cuenta como incumplido -- no hay
  // promesa que romper todavía, y meterlo hundiría el porcentaje de quien
  // recién recibió trabajo. Quien no tiene entregas queda con pct = null, que
  // se muestra como "sin entregas" y NUNCA como 0%.
  // ==========================================================================

  function agruparCumplimiento(items, campo, etiquetaVacia) {
    var grupos = {};
    (items || []).forEach(function (i) {
      var k = i[campo] || etiquetaVacia || '(sin dato)';
      if (!grupos[k]) grupos[k] = { total: 0, entregados: 0, aTiempo: 0, abiertos: 0 };
      grupos[k].total++;
      if (i.fecha_terminada && i.fecha_comprometida) {
        grupos[k].entregados++;
        if (new Date(i.fecha_terminada) <= new Date(i.fecha_comprometida)) grupos[k].aTiempo++;
      } else if (!i.fecha_terminada) {
        grupos[k].abiertos++;
      }
    });
    return Object.keys(grupos).map(function (k) {
      var g = grupos[k];
      return {
        etiqueta: k, total: g.total, entregados: g.entregados,
        aTiempo: g.aTiempo, abiertos: g.abiertos,
        pct: g.entregados ? Math.round(g.aTiempo / g.entregados * 100) : null
      };
    }).sort(function (a, b) {
      // Los que no tienen entregas van al final: no se pueden ordenar por un
      // porcentaje que no existe.
      if (a.pct === null && b.pct === null) return b.total - a.total;
      if (a.pct === null) return 1;
      if (b.pct === null) return -1;
      return b.pct - a.pct;
    });
  }

  function tablaCumplimiento(filas, etiquetaDimension) {
    return tabla([
      { campo: 'etiqueta', titulo: etiquetaDimension },
      { campo: 'total', titulo: 'Ítems', alinear: 'derecha' },
      { campo: 'abiertos', titulo: 'Abiertos', alinear: 'derecha' },
      { campo: 'entregados', titulo: 'Entregados', alinear: 'derecha' },
      { campo: 'aTiempo', titulo: 'A tiempo', alinear: 'derecha' },
      { campo: 'pctTexto', titulo: 'Cumplimiento', alinear: 'derecha' }
    ], filas.map(function (f) {
      var o = {};
      Object.keys(f).forEach(function (k) { o[k] = f[k]; });
      o.pctTexto = f.pct === null ? 'sin entregas' : f.pct + '%';
      return o;
    }), { vacio: 'No hay ítems en este corte.' });
  }

  /**
   * Cuerpo completo de un reporte de cumplimiento por una dimensión.
   * @param {Array} items
   * @param {Object} opts { campo, etiquetaVacia, dimension, etiquetaTotal }
   */
  function cuerpoCumplimientoPor(items, opts) {
    opts = opts || {};
    var filas = agruparCumplimiento(items, opts.campo, opts.etiquetaVacia);
    var medibles = filas.filter(function (f) { return f.pct !== null; });
    return kpis([
      { etiqueta: opts.etiquetaTotal || (opts.dimension + 's'), valor: filas.length },
      { etiqueta: 'Ítems considerados', valor: (items || []).length },
      { etiqueta: 'Ya medibles', valor: medibles.length,
        titulo: 'Sólo se puede medir cumplimiento donde hay entregas con fecha comprometida.' }
    ]) +
    ranking(medibles.map(function (f) {
      return { etiqueta: f.etiqueta, valor: f.pct, texto: f.pct + '%' };
    }), { vacio: 'Todavía no hay entregas con fecha comprometida: no hay cumplimiento que medir.' }) +
    '<h4>Detalle</h4>' +
    tablaCumplimiento(filas, opts.dimension || 'Grupo');
  }

  /**
   * Entrada vs salida por mes. `serie` = [{etiqueta, creadas, cerradas, ...}],
   * el formato que ya devuelven calcularTendenciaTemporal_ (Gerencia) y
   * calcularTendenciaJefatura_.
   */
  function cuerpoEntradaSalida(serie) {
    serie = serie || [];
    if (!serie.length) return window.Componentes.vacio('Sin datos de los últimos meses.');
    var entraron = serie.reduce(function (s, t) { return s + (Number(t.creadas) || 0); }, 0);
    var cerradas = serie.reduce(function (s, t) { return s + (Number(t.cerradas) || 0); }, 0);
    var saldo = entraron - cerradas;
    return kpis([
      { etiqueta: 'Entraron', valor: entraron },
      { etiqueta: 'Se cerraron', valor: cerradas },
      { etiqueta: 'Saldo de la cola', valor: (saldo > 0 ? '+' : '') + saldo, alerta: saldo > 0,
        titulo: 'Positivo = entra más de lo que sale: la cola crece.' }
    ]) +
    '<h4>Entradas por mes</h4>' +
    tendencia(serie.map(function (t) { return { etiqueta: t.etiqueta, valor: t.creadas }; }),
      { titulo: 'Creadas por mes' }) +
    '<h4>Cierres por mes</h4>' +
    tendencia(serie.map(function (t) { return { etiqueta: t.etiqueta, valor: t.cerradas }; }),
      { titulo: 'Cerradas por mes' }) +
    '<h4>Detalle</h4>' +
    tabla([
      { campo: 'etiqueta', titulo: 'Mes' },
      { campo: 'creadas', titulo: 'Entraron', alinear: 'derecha' },
      { campo: 'cerradas', titulo: 'Se cerraron', alinear: 'derecha' }
    ], serie);
  }

  /**
   * Resbalón de compromisos: ítems que movieron su fecha comprometida o que
   * se reabrieron. Vive en el motor porque Gerencia y Jefatura lo miden
   * igual desde la v12.5, cuando Jefatura.getPanel empezó a exponer los
   * mismos campos.
   *
   * La REAPERTURA importa aparte del re-compromiso: es la medida de "se
   * entregó mal", y el % de cumplimiento no la captura -- un cierre rápido
   * que se reabre tres veces igual cuenta como "a tiempo" ahí.
   *
   * `columnasExtra` deja que cada módulo agregue sus propias dimensiones
   * (Gerencia tiene área; Jefatura no).
   */
  function cuerpoResbalon(items, opts) {
    opts = opts || {};
    items = items || [];
    var movidos = items.filter(function (i) {
      return Number(i.re_compromisos) > 0 || Number(i.reaperturas) > 0;
    }).sort(function (a, b) {
      return (Number(b.re_compromisos) + Number(b.reaperturas)) -
             (Number(a.re_compromisos) + Number(a.reaperturas));
    });
    var totalRe = items.reduce(function (s, i) { return s + (Number(i.re_compromisos) || 0); }, 0);
    var totalReab = items.reduce(function (s, i) { return s + (Number(i.reaperturas) || 0); }, 0);
    var columnas = [{ campo: 'titulo', titulo: 'Ítem' }]
      .concat(opts.columnasExtra || [])
      .concat([
        { campo: 'desarrollador_nombre', titulo: 'Responsable' },
        { campo: 're_compromisos', titulo: 'Movió fecha', alinear: 'derecha' },
        { campo: 'reaperturas', titulo: 'Reaperturas', alinear: 'derecha' },
        { campo: 'fecha_original', titulo: 'Fecha original' },
        { campo: 'fecha_comprometida', titulo: 'Fecha vigente' }
      ]);
    return kpis([
      { etiqueta: 'Ítems que movieron fecha',
        valor: items.filter(function (i) { return Number(i.re_compromisos) > 0; }).length },
      { etiqueta: 'Re-compromisos', valor: totalRe },
      { etiqueta: 'Reaperturas', valor: totalReab, alerta: totalReab > 0,
        titulo: 'Un ítem que se cerró y volvió a abrirse: el % de cumplimiento no lo captura.' }
    ]) +
    tabla(columnas, movidos, { vacio: 'Ningún ítem movió su fecha ni se reabrió. Nada que revisar.' });
  }
  // ==========================================================================
  // DOCUMENTO IMPRIMIBLE (v13.2)
  //
  // Un reporte que se manda a Gerencia deja de ser una pantalla y pasa a ser
  // un DOCUMENTO. Necesita decir, por si solo y sin que nadie lo explique:
  // de que organizacion es, que reporte es, sobre que periodo, con que
  // filtros, quien lo genero y cuando.
  //
  // Sin eso, una tabla impresa es un papel sin dueño: nadie puede saber si
  // sigue vigente, y en una auditoria no vale como evidencia.
  //
  // Se dibuja SIEMPRE (no solo al imprimir) porque tambien sirve en pantalla
  // para saber que se esta mirando; el CSS de impresion lo reordena a A4.
  function cabeceraDocumento(opts) {
    opts = opts || {};
    var ahora = new Date();
    var fmt = function (d) {
      try { return d.toLocaleString('es-CL', { dateStyle: 'long', timeStyle: 'short' }); }
      catch (e) { return d.toISOString().slice(0, 16).replace('T', ' '); }
    };
    var filtros = (opts.filtros || []).filter(function (f) { return f && f.valor; });
    return '<header class="sigso-doc">' +
      '<div class="sigso-doc__cab">' +
        '<div class="sigso-doc__marca">' +
          '<span class="sigso-doc__logo">S</span>' +
          '<span>' +
            '<strong>SIGSO</strong>' +
            '<span class="sigso-doc__org">' + esc_(opts.organizacion || 'Asesorías Integrales AyS SpA') + '</span>' +
          '</span>' +
        '</div>' +
        '<div class="sigso-doc__ref">' +
          (opts.codigo ? '<span>' + esc_(opts.codigo) + '</span>' : '') +
          '<span>' + fmt(ahora) + '</span>' +
        '</div>' +
      '</div>' +
      '<h1 class="sigso-doc__tit">' + esc_(opts.titulo || 'Reporte') + '</h1>' +
      (opts.subtitulo ? '<p class="sigso-doc__sub">' + esc_(opts.subtitulo) + '</p>' : '') +
      '<dl class="sigso-doc__meta">' +
        (opts.modulo ? '<div><dt>Módulo</dt><dd>' + esc_(opts.modulo) + '</dd></div>' : '') +
        (opts.periodo ? '<div><dt>Período</dt><dd>' + esc_(opts.periodo) + '</dd></div>' : '') +
        (opts.generadoPor ? '<div><dt>Generado por</dt><dd>' + esc_(opts.generadoPor) + '</dd></div>' : '') +
        filtros.map(function (f) {
          return '<div><dt>' + esc_(f.etiqueta) + '</dt><dd>' + esc_(f.valor) + '</dd></div>';
        }).join('') +
      '</dl>' +
    '</header>';
  }

  // Pie que sólo aparece impreso: deja constancia del origen del documento.
  function pieDocumento(nota) {
    return '<footer class="sigso-doc-pie">' +
      esc_(nota || 'Documento generado por SIGSO a partir de los datos vigentes al momento de su emisión.') +
    '</footer>';
  }
  // ==========================================================================
  // EXPORTACIÓN (§13)
  // ==========================================================================
  // El CSV sale de la TABLA YA PINTADA, no de una segunda consulta: así lo que
  // se descarga es exactamente lo que la persona está viendo. Si saliera de
  // otra consulta podrían diferir, y en un reporte de gestión eso es grave.
  function barraAcciones(opts) {
    opts = opts || {};
    return '<div class="sigso-rep-acciones">' +
      (opts.volver !== false
        ? '<button type="button" class="sigso-boton--sutil js-rep-volver">← Centro de reportes</button>' : '') +
      '<span class="sigso-rep-acciones__sep"></span>' +
      '<button type="button" class="sigso-boton--secundario js-rep-csv">Exportar CSV</button>' +
      '<button type="button" class="sigso-boton--secundario js-rep-imprimir">Imprimir / PDF</button>' +
    '</div>';
  }

  function wireAcciones(contenedor, opts) {
    opts = opts || {};
    contenedor.querySelectorAll('.js-rep-volver').forEach(function (b) {
      b.addEventListener('click', function () { if (opts.onVolver) opts.onVolver(); });
    });
    contenedor.querySelectorAll('.js-rep-csv').forEach(function (b) {
      b.addEventListener('click', function () {
        var tabla = contenedor.querySelector('table');
        if (!tabla) {
          window.Componentes.aviso({ texto: 'Este reporte no tiene una tabla que exportar.', tipo: 'aviso' });
          return;
        }
        descargarCsv_(tabla, opts.nombreArchivo || 'sigso-reporte');
      });
    });
    contenedor.querySelectorAll('.js-rep-imprimir').forEach(function (b) {
      b.addEventListener('click', function () { window.print(); });
    });
  }

  function descargarCsv_(tabla, nombre) {
    var lineas = [];
    Array.prototype.forEach.call(tabla.querySelectorAll('tr'), function (tr) {
      var celdas = Array.prototype.map.call(tr.querySelectorAll('th,td'), function (c) {
        // El texto visible, no el HTML: lo que se exporta es lo que se lee.
        return '"' + String(c.innerText || '').trim().replace(/"/g, '""') + '"';
      });
      if (celdas.length) lineas.push(celdas.join(','));
    });
    // El primer caracter del literal de abajo es un BOM (U+FEFF). Es
    // INVISIBLE en el editor, asi que no lo borres: sin el, Excel en Windows
    // abre el CSV con los acentos rotos y hay que importarlo a mano.
    var blob = new Blob(['﻿' + lineas.join('\r\n')], { type: 'text/csv;charset=utf-8;' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = nombre + '-' + new Date().toISOString().slice(0, 10) + '.csv';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(a.href);
  }

  window.SigsoReportes = {
    TIPOS: TIPOS,
    registrar: registrar,
    obtener: obtener,
    buscarReporte: buscarReporte,
    pintarCatalogo: pintarCatalogo,
