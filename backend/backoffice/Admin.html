/* --- Recorte: el usuario arrastra la foto dentro del circulo ------------ */
.sigso-recorte { display: flex; flex-direction: column; gap: var(--esp-3); align-items: center; }

.sigso-recorte__lienzo {
  position: relative;
  width: 260px;
  max-width: 100%;
  aspect-ratio: 1;
  border-radius: 50%;
  overflow: hidden;
  background: var(--superficie-2);
  box-shadow: 0 0 0 1px var(--borde);
  cursor: grab;
  /* Sin esto, arrastrar en movil hace scroll de la pagina en vez de mover
     la foto: el gesto se lo lleva el navegador. */
  touch-action: none;
}
.sigso-recorte__lienzo:active { cursor: grabbing; }
.sigso-recorte__lienzo canvas { display: block; width: 100%; height: 100%; }

.sigso-recorte__zoom { display: flex; align-items: center; gap: var(--esp-2); width: 260px; max-width: 100%; }
.sigso-recorte__zoom input[type="range"] { flex: 1; accent-color: var(--primario); }

.sigso-recorte__ayuda { color: var(--texto-3); font: var(--t-small); text-align: center; }
.sigso-recorte__botones { display: flex; gap: var(--esp-2); flex-wrap: wrap; justify-content: center; }

/* --- Movil: el perfil pasa a una columna ------------------------------- */
@media (max-width: 640px) {
  .sigso-perfil { grid-template-columns: 1fr; justify-items: center; text-align: center; }
  .sigso-perfil__datos { text-align: left; width: 100%; }
  .sigso-perfil__acciones { max-width: 260px; }
  .sigso-perfil__campos { grid-template-columns: 1fr; gap: var(--esp-1) 0; }
  .sigso-perfil__campos dt { margin-top: var(--esp-2); }
}

/* --- v6.4: identidad en el header del Backoffice (app.html / admin.html) --
   Estas paginas no tenian ninguna referencia al usuario conectado. El bloque
   queda vacio en index.html/estado.html, que son publicas. ---------------- */
.sigso-header__usuario { margin-left: auto; display: flex; align-items: center; }
.sigso-header__usuario:empty { display: none; }

/* Chip de identidad: avatar y nombre viajan dentro de una misma pastilla
   con fondo propio, para que el avatar se lea como parte de la identidad y
   no como un icono suelto al lado del texto. Misma forma que el boton de
   usuario del shell por token (.plataforma-usuario), para que las dos vias
   de acceso se sientan el mismo producto. */
.sigso-header__usuario-btn {
  display: flex;
  align-items: center;
  gap: var(--esp-2);
  padding: 0.25rem 0.7rem 0.25rem 0.3rem;
  border: 1px solid var(--borde);
  border-radius: var(--radio-full);
  background: var(--superficie);
  color: inherit;
  font: inherit;
  cursor: pointer;
  text-align: left;
  transition: background var(--mov-rapido), border-color var(--mov-rapido),
              box-shadow var(--mov-rapido);
}
.sigso-header__usuario-btn:hover {
  background: var(--superficie-2);
  border-color: var(--borde-fuerte);
  box-shadow: var(--sombra-1);
}
.sigso-header__usuario-btn:focus-visible { outline: 2px solid var(--primario); outline-offset: 2px; }

.sigso-header__usuario-txt { display: flex; flex-direction: column; line-height: 1.2; min-width: 0; }
.sigso-header__usuario-nombre {
  font-size: var(--texto-sm); font-weight: 600; color: var(--texto);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 16ch;
}
.sigso-header__usuario-rol {
  font-size: var(--texto-xs); color: var(--texto-3);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 16ch;
}

/* En movil el chip se reduce al avatar: el header ya va justo de ancho con
   la marca y la navegacion. Sigue siendo pulsable y con el mismo destino. */
@media (max-width: 640px) {
  .sigso-header__usuario-btn { padding: 0.25rem; border-radius: 50%; }
  .sigso-header__usuario-txt { display: none; }
}

/* --- v6.4: autor con avatar en comentarios e historial ------------------ */
.sigso-timeline__autor {
  display: inline-flex;
  align-items: center;
  gap: var(--esp-2);
  min-width: 0;
}
.sigso-timeline__autor .sigso-avatar { flex: none; }

/* === v6.5: modulo Novedades ============================================= */

/* Colores de tipo/vigencia reusan los tokens semanticos (--critico/--alerta/
   --info/--ok), no colores nuevos -- mismo criterio que el chip de
   situacion SLA de la Bandeja. */
.sigso-badge--critico { background: var(--critico); }
.sigso-badge--alerta { background: var(--alerta); }
.sigso-badge--info { background: var(--info); }
.sigso-badge--ok { background: var(--ok); }
/* v7.0 (Fase 2): etiqueta neutra generica -- "no planificado", "recurrente"
   -- no comunica estado ni urgencia, solo un dato adicional del contexto. */
.sigso-badge--neutro { background: var(--superficie-2); color: var(--texto-2); }

.sigso-novedades__cabecera {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--esp-3);
  flex-wrap: wrap;
  margin-bottom: var(--esp-4);
}

.sigso-novedades__chips {
  display: flex;
  gap: var(--esp-2);
  flex-wrap: wrap;
}

.sigso-novedades__lista {
  display: flex;
  flex-direction: column;
  gap: var(--esp-3);
}

/* Tarjeta: franja de color a la izquierda (tipo) + cuerpo. El punto indigo
   de "no leida" es la senal minima -- nada de fondos llamativos, para que el
   feed siga siendo legible aunque tenga varias sin leer. */
.sigso-novedad-card {
  display: flex;
  width: 100%;
  text-align: left;
  background: var(--superficie);
  border: 1px solid var(--borde);
  border-radius: var(--radio-md);
  overflow: hidden;
  cursor: pointer;
  transition: box-shadow var(--mov-rapido), border-color var(--mov-rapido);
}
.sigso-novedad-card:hover,
.sigso-novedad-card:focus-visible {
  border-color: var(--borde-fuerte);
  box-shadow: var(--sombra-1);
  outline: none;
}
.sigso-novedad-card:focus-visible { outline: 2px solid var(--primario); outline-offset: -2px; }

.sigso-novedad-card__franja { width: 4px; flex: none; }
.sigso-novedad-card__franja--critico { background: var(--critico); }
.sigso-novedad-card__franja--alerta { background: var(--alerta); }
.sigso-novedad-card__franja--info { background: var(--info); }
.sigso-novedad-card__franja--ok { background: var(--ok); }

.sigso-novedad-card__cuerpo {
  flex: 1;
  min-width: 0;
  padding: var(--esp-4);
  display: flex;
  flex-direction: column;
  gap: var(--esp-2);
}

.sigso-novedad-card__meta-top {
  display: flex;
  align-items: center;
  gap: var(--esp-2);
  flex-wrap: wrap;
}

.sigso-novedad-card__area {
  font-size: var(--texto-xs);
  color: var(--texto-3);
  background: var(--superficie-2);
  padding: 0.1rem 0.5rem;
  border-radius: var(--radio-full);
}

.sigso-punto-no-leido {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--primario);
  flex: none;
  margin-left: auto;
}

.sigso-novedad-card__titulo {
  margin: 0;
  font-size: var(--texto-lg);
  color: var(--texto);
}

.sigso-novedad-card__resumen {
  margin: 0;
  color: var(--texto-2);
  font: var(--t-body);
}

.sigso-novedad-card__meta-bottom {
  display: flex;
  align-items: center;
  gap: var(--esp-2);
  margin-top: var(--esp-1);
  color: var(--texto-3);
  font-size: var(--texto-xs);
}

.sigso-novedad-card__leida { color: var(--ok); display: inline-flex; align-items: center; gap: 0.25rem; }
.sigso-novedad-card__pendiente {
  color: var(--alerta);
  font-weight: 600;
  margin-left: auto;
}

/* Tarjetas sin leer se distinguen por el titulo con mas peso -- sutil, no
   un fondo de color que compita con el resto del feed. */
.sigso-novedad-card--no-leida .sigso-novedad-card__titulo { font-weight: 700; }

/* --- Detalle (modal) ----------------------------------------------------- */
.sigso-novedad-detalle__titulo { margin: var(--esp-2) 0; color: var(--texto); }
.sigso-novedad-detalle__autor {
  display: flex;
  align-items: center;
  gap: var(--esp-2);
  margin: var(--esp-3) 0;
}
.sigso-novedad-detalle__cuerpo {
  color: var(--texto);
  font: var(--t-body);
  line-height: 1.6;
  margin: var(--esp-3) 0;
  white-space: pre-wrap;
}
.sigso-novedad-detalle__acciones {
  display: flex;
  gap: var(--esp-2);
  flex-wrap: wrap;
  margin-top: var(--esp-4);
  padding-top: var(--esp-3);
  border-top: 1px solid var(--borde);
}

/* --- Fase 2: quien leyo / quien falta --------------------------------------- */
.sigso-lectores {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: var(--esp-4);
  margin-top: var(--esp-3);
  padding-top: var(--esp-3);
  border-top: 1px solid var(--borde);
}
.sigso-lectores h4 { margin: 0 0 var(--esp-2); font: var(--t-small); color: var(--texto-2); }
.sigso-lectores-lista { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: var(--esp-1); }
.sigso-lectores-lista li { display: flex; align-items: center; gap: var(--esp-1); font: var(--t-body); color: var(--texto); }
.sigso-lectores-lista--pendiente li { color: var(--texto-2); }
@media (max-width: 560px) {
  .sigso-lectores { grid-template-columns: 1fr; }
}

/* --- Formulario de publicar ------------------------------------------------ */
.sigso-novedad-form { display: flex; flex-direction: column; gap: var(--esp-3); max-height: 60vh; overflow-y: auto; }
.sigso-campo-check { display: flex; align-items: center; gap: var(--esp-2); font: var(--t-body); color: var(--texto); }

/* v6.7 (Fase 5, Novedades): selector de audiencia (publicar/aprobar). */
.sigso-audiencia-opciones { display: flex; flex-wrap: wrap; gap: var(--esp-3); margin-bottom: var(--esp-2); }
.sigso-audiencia-lista {
  display: flex; flex-direction: column; gap: var(--esp-1);
  max-height: 10rem; overflow-y: auto;
  border: 1px solid var(--borde); border-radius: var(--radio-md);
  padding: var(--esp-2);
}

/* --- v7.0 Fase 2: "Mi trabajo" (Actividades.gs / actividades.js) --------
   Wireframe: documentacion/SIGSO-v7.0-propuesta-modulo-gestion-operacional.md
   §5.1. Reusa el vocabulario visual existente (sigso-badge, sigso-card) --
   los unicos tokens nuevos son para el semaforo propio de la actividad. */
.sigso-mt-resumen {
  display: flex; align-items: center; gap: var(--esp-5); flex-wrap: wrap;
  padding: var(--esp-3) var(--esp-4);
  background: var(--superficie-2); border: 1px solid var(--borde); border-radius: var(--radio-md);
  margin-bottom: var(--esp-4);
}
.sigso-mt-resumen__item { display: flex; flex-direction: column; }
.sigso-mt-resumen__num { font-size: 1.4rem; font-weight: 700; letter-spacing: -0.01em; }
.sigso-mt-resumen__rot { font-size: var(--texto-xs); color: var(--texto-3); text-transform: uppercase; letter-spacing: 0.04em; }
.sigso-mt-resumen__acciones { margin-left: auto; display: flex; gap: var(--esp-2); flex-wrap: wrap; }

.sigso-mt-lista { display: flex; flex-direction: column; gap: var(--esp-2); }
.sigso-mt-card {
  background: var(--superficie); border: 1px solid var(--borde); border-radius: var(--radio-md);
  padding: var(--esp-3) var(--esp-4);
}
.sigso-mt-card--riesgo, .sigso-mt-card--atrasada { border-color: var(--alerta); }
.sigso-mt-card--bloqueada { border-color: var(--info); }

.sigso-mt-card__top { display: flex; align-items: center; gap: var(--esp-2); flex-wrap: wrap; }
.sigso-mt-card__titulo { font-weight: 600; color: var(--texto); }
.sigso-mt-card__meta {
  margin-top: var(--esp-1); font-size: var(--texto-sm); color: var(--texto-3);
  display: flex; gap: var(--esp-4); flex-wrap: wrap;
}
.sigso-mt-card__meta b { color: var(--texto-2); font-weight: 600; }

.sigso-mt-bloqueo {
  margin-top: var(--esp-2); font-size: var(--texto-sm); color: var(--info);
  background: var(--info-suave); border-radius: var(--radio-sm); padding: var(--esp-1) var(--esp-2);
}

/* v11 (P2, "subtareas con rollup"): la subtarea aparece justo bajo su padre
   (ordenarConSubtareas_), con una leve indentación + la referencia al padre. */
.sigso-py-tarea--subtarea { margin-left: var(--esp-4); border-left: 2px solid var(--borde); padding-left: var(--esp-2); }
.sigso-py-subtarea-de { font-size: var(--texto-xs); color: var(--texto-3); margin-bottom: 2px; }
.sigso-py-rollup { margin-top: var(--esp-2); display: flex; align-items: center; gap: var(--esp-2); font-size: var(--texto-xs); color: var(--texto-3); }
.sigso-py-rollup__barra { flex: 1 1 auto; max-width: 8rem; height: 0.4rem; border-radius: 999px; background: var(--superficie-2); overflow: hidden; }
.sigso-py-rollup__barra-fill { height: 100%; background: var(--primario); border-radius: inherit; }

.sigso-mt-badge--al-dia { background: var(--ok-suave); color: var(--ok); }
.sigso-mt-badge--riesgo { background: var(--alerta-suave); color: var(--alerta); }
.sigso-mt-badge--atrasada { background: var(--critico-suave); color: var(--critico); }
.sigso-mt-badge--bloqueada { background: var(--info-suave); color: var(--info); }
.sigso-mt-badge--pendiente { background: var(--superficie-2); color: var(--texto-2); }
.sigso-mt-badge--revision { background: var(--primario-suave); color: var(--primario-tinta); }
.sigso-mt-badge--terminada,
.sigso-mt-badge--cancelada { background: var(--superficie-2); color: var(--texto-3); }

.sigso-mt-checkin {
  margin-top: var(--esp-3); padding-top: var(--esp-3); border-top: 1px dashed var(--borde);
  display: flex; gap: var(--esp-2); flex-wrap: wrap;
}
.sigso-mt-pastilla {
  border: 1px solid var(--borde-fuerte); background: var(--superficie); color: var(--texto-2);
  border-radius: var(--radio-full); padding: 0.4rem 0.9rem; font-size: var(--texto-sm); font-weight: 600;
  cursor: pointer; transition: background var(--mov-rapido), border-color var(--mov-rapido);
}
.sigso-mt-pastilla:hover { border-color: var(--borde-fuerte); background: var(--superficie-2); }
.sigso-mt-pastilla--destacada {
  border-color: var(--primario); color: var(--primario-tinta); background: var(--primario-suave);
}

.sigso-mt-terminadas {
  margin-top: var(--esp-3); text-align: center; color: var(--texto-3); font-size: var(--texto-sm);
  padding: var(--esp-3); border: 1px dashed var(--borde); border-radius: var(--radio-md);
}

/* v10 (Fase G2, "el dia se justifica mejor" de la Carta Gantt de
   Dedicacion): horas + nota opcionales, plegadas bajo las pastillas de
   check-in -- no le agregan un solo clic al camino rapido de siempre
   (Avance/Sin cambios/Listo con un clic), solo estan ahi para quien
   quiera dejar contexto, igual que ya se puede al bloquear una tarea. */
.sigso-mt-checkin-wrap { margin-top: var(--esp-3); padding-top: var(--esp-3); border-top: 1px dashed var(--borde); }
.sigso-mt-checkin-wrap .sigso-mt-checkin { margin-top: var(--esp-2); padding-top: 0; border-top: none; }
.sigso-mt-checkin-extra summary { cursor: pointer; font-size: var(--texto-xs); color: var(--primario); user-select: none; }
.sigso-mt-checkin-extra__campos { display: flex; gap: var(--esp-2); margin-top: var(--esp-2); flex-wrap: wrap; }
.sigso-mt-checkin-extra__campos input {
  border: 1px solid var(--borde); border-radius: var(--radio-sm); background: var(--superficie);
  color: var(--texto); padding: 0.35rem 0.6rem; font-size: var(--texto-sm); font-family: inherit;
}
.sigso-mt-checkin-extra__campos input[type="number"] { width: 5.5rem; flex: 0 0 auto; }
.sigso-mt-checkin-extra__campos input[type="text"] { flex: 1 1 12rem; }

/* ============ v9.0 (Modulo de Proyectos, MVP Fase 1) ============
   Mismo lenguaje visual que "Mi trabajo" (sigso-mt-*): tarjetas con borde
   de 1px, chips de estado por color semantico, sin sombras nuevas. La
   "salud" del proyecto usa los mismos tokens semanticos que el resto de
   SIGSO (--ok/--alerta/--critico), nunca colores nuevos. */

.sigso-py-cabecera {
  display: flex; align-items: center; justify-content: space-between; gap: var(--esp-3);
  margin-bottom: var(--esp-4); flex-wrap: wrap;
}
.sigso-py-cabecera__izq { display: flex; gap: var(--esp-2); align-items: center; flex-wrap: wrap; }
.sigso-py-am-tareas {
  border: 1px solid var(--borde); border-radius: var(--radio); padding: var(--esp-3); margin: var(--esp-3) 0;
  max-height: 260px; overflow-y: auto;
}
.sigso-py-am-tareas legend { font-weight: 600; font-size: var(--texto-sm); }
.sigso-py-am-todas { border-bottom: 1px solid var(--borde); padding-bottom: var(--esp-2); margin-bottom: var(--esp-2); }

.sigso-py-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(19rem, 1fr)); gap: var(--esp-3);
}

.sigso-py-card {
  text-align: left; font: inherit; cursor: pointer;
  background: var(--superficie); border: 1px solid var(--borde); border-radius: var(--radio-md);
  padding: var(--esp-4); display: flex; flex-direction: column; gap: var(--esp-2);
  transition: border-color var(--mov-rapido), box-shadow var(--mov-rapido);
}
.sigso-py-card:hover { border-color: var(--borde-fuerte); box-shadow: var(--sombra-1); }

.sigso-py-card__top { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--esp-2); }
.sigso-py-card__nombre { font-weight: 600; color: var(--texto); }
.sigso-py-card__desc { margin: 0; font-size: var(--texto-sm); color: var(--texto-2); }

.sigso-py-card__barra {
  height: 6px; border-radius: var(--radio-full); background: var(--superficie-2); overflow: hidden;
}
/* v10 (Fase A, "tarjetas con mas pulso"): antes la barra era SIEMPRE azul,
   sin importar si el proyecto estaba critico -- la salud (color) ya vive en
   la pildora de arriba, pero aca es donde el ojo mira primero. */
.sigso-py-card__barra-fill { height: 100%; background: var(--primario); border-radius: var(--radio-full); }
.sigso-py-card__barra-fill--riesgo { background: var(--alerta); }
.sigso-py-card__barra-fill--critico { background: var(--critico); }

.sigso-py-card__meta {
  display: flex; gap: var(--esp-3); flex-wrap: wrap; font-size: var(--texto-sm); color: var(--texto-2);
}
.sigso-py-card__meta b { color: var(--texto); font-weight: 600; }

/* v10.03.26 (medido en vivo): --texto-3 da 2.95:1, bajo el minimo AA (4.5:1)
   para texto normal -- mismo defecto ya corregido en otros componentes esta
   sesion. Se sube a --texto-2 (5.7:1). */
.sigso-py-card__motivos { margin: 0; font-size: var(--texto-xs); color: var(--texto-2); }

/* Fila de "pulso": avatares del equipo + proximo vencimiento, entre la meta
   y los motivos -- lo que responde "¿quien esta, y para cuando?" sin abrir
   el proyecto. */
.sigso-py-card__pulso {
  display: flex; align-items: center; justify-content: space-between; gap: var(--esp-2);
}
.sigso-py-card__avatares { display: flex; }
.sigso-py-card__avatar {
  margin-left: -0.5rem; border: 2px solid var(--superficie); border-radius: 50%;
}
.sigso-py-card__avatar:first-child { margin-left: 0; }
.sigso-py-card__avatar--extra {
  display: inline-flex; align-items: center; justify-content: center;
  width: 24px; height: 24px; border-radius: 50%;
  background: var(--superficie-2); color: var(--texto-2); font-size: 0.62rem; font-weight: 700;
  border: 2px solid var(--superficie);
}
.sigso-py-card__vence { font-size: var(--texto-xs); color: var(--texto-2); white-space: nowrap; }
.sigso-py-card__vence--atrasado { color: var(--critico); font-weight: 600; }

.sigso-py-card__novedad {
  display: flex; align-items: center; gap: 0.35rem;
  margin: 0; font-size: var(--texto-xs); color: var(--texto-2);
}
.sigso-py-card__novedad svg { flex: 0 0 auto; opacity: .8; }

.sigso-py-motivos {
  margin: 0 0 var(--esp-3); font-size: var(--texto-sm); color: var(--texto-3);
}

.sigso-py-salud {
  display: inline-flex; align-items: center; font-size: var(--texto-sm); font-weight: 600;
  padding: 0.2rem 0.6rem; border-radius: var(--radio-full); white-space: nowrap;
}
.sigso-py-salud--normal { background: var(--ok-suave); color: var(--ok); }
.sigso-py-salud--riesgo { background: var(--alerta-suave); color: var(--alerta); }
.sigso-py-salud--critico { background: var(--critico-suave); color: var(--critico); }

/* v11 ("mejoras visuales del módulo"): "← Portafolio" vive en su propia
   migaja de pan, chica y muda -- ya no compite en peso visual con el
   título de la cabecera. */
.sigso-py-migaja { margin-bottom: var(--esp-2); }
.sigso-py-migaja .sigso-boton { padding-left: 0; }

.sigso-py-detalle-cab {
  display: flex; align-items: center; justify-content: space-between; gap: var(--esp-3); flex-wrap: wrap; margin-bottom: var(--esp-2);
}
.sigso-py-detalle-cab h1 { margin: 0; flex: 1 1 auto; min-width: 10rem; font-size: 1.5rem; letter-spacing: -0.01em; }
/* Salud + estado agrupados como un solo "cluster" a la derecha del título
   (se van debajo en mobile) -- antes eran piezas sueltas envolviendo junto
   al botón de volver y al h1, con el mismo peso visual que el título. */
.sigso-py-detalle-cab__estado { display: flex; align-items: center; gap: var(--esp-2); flex-wrap: wrap; flex: 0 0 auto; }

.sigso-py-cuerpo { margin-top: var(--esp-4); }

/* v11 ("mejoras visuales del módulo", densidad de KPIs): antes cada tile
   crecía hasta `1fr` -- con 3-4 KPIs en una fila ancha (Resumen, Rendimiento,
   Analítica, Workload, el resumen del portafolio... todos usan esta misma
   grilla) quedaban como rectángulos enormes y vacíos alrededor de un solo
   número. Con un máximo (`12rem`) los tiles se quedan del tamaño de una
   tarjeta real y el espacio sobrante de la fila queda como aire, no
   estirado dentro de cada tile. */
.sigso-py-kpis {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(9rem, 12rem)); gap: var(--esp-3);
  margin-bottom: var(--esp-4);
}

/* v13 (Fase 2, "dashboard ejecutivo"): la banda de 8 KPIs del Resumen es más
   densa que las de siempre (que solían tener 4-5 tiles) -- tiles un poco más
   angostos para que quepan más por fila sin scroll horizontal. */
.sigso-py-kpis--resumen { grid-template-columns: repeat(auto-fit, minmax(8rem, 1fr)); }

.sigso-py-proximo-hito {
  display: flex; align-items: center; gap: var(--esp-2); margin-bottom: var(--esp-4);
  padding: var(--esp-3); background: var(--superficie-2); border-radius: var(--radio);
  font-size: var(--texto-sm); color: var(--texto-2);
}
.sigso-py-proximo-hito svg { color: var(--primario); flex-shrink: 0; }

.sigso-py-seccion-tit { font-size: var(--texto-base); font-weight: 600; margin: var(--esp-5) 0 var(--esp-2); color: var(--texto); }

.sigso-py-atencion { display: flex; flex-direction: column; gap: var(--esp-2); }
.sigso-py-atencion--vacia {
  display: flex; align-items: center; gap: var(--esp-2); color: var(--ok);
  background: var(--superficie-2); border-radius: var(--radio); padding: var(--esp-3);
  font-size: var(--texto-sm);
}
.sigso-py-atencion-item {
  display: flex; align-items: center; gap: var(--esp-2); width: 100%; text-align: left;
  background: var(--superficie-2); border: 1px solid transparent; border-radius: var(--radio);
  padding: var(--esp-2) var(--esp-3); cursor: pointer; font: inherit; color: var(--texto);
}
.sigso-py-atencion-item:hover { border-color: var(--borde); background: var(--superficie-3, var(--superficie-2)); }
.sigso-py-atencion-item svg { color: var(--critico); flex-shrink: 0; }
.sigso-py-atencion-item__tit { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
.sigso-py-atencion-item__meta { color: var(--texto-3); font-size: var(--texto-sm); white-space: nowrap; }

.sigso-py-acciones { display: flex; gap: var(--esp-2); margin-top: var(--esp-4); flex-wrap: wrap; }

.sigso-py-form-fila { display: flex; gap: var(--esp-3); flex-wrap: wrap; }
.sigso-py-form-fila > * { flex: 1 1 10rem; }

.sigso-py-lista { display: flex; flex-direction: column; gap: var(--esp-2); }

.sigso-py-tarea, .sigso-py-hito, .sigso-py-riesgo {
  background: var(--superficie); border: 1px solid var(--borde); border-radius: var(--radio-md);
  padding: var(--esp-3) var(--esp-4);
}

/* v9.4: riesgos -- acento por nivel (probabilidad x impacto, calculado en el backend) */
.sigso-py-riesgo { border-left: 3px solid var(--borde-fuerte); }
.sigso-py-riesgo--alta { border-left-color: var(--critico); }
.sigso-py-riesgo--media { border-left-color: var(--alerta); }
.sigso-py-riesgo--baja { border-left-color: var(--ok); }

/* v9.4: resumen ejecutivo del portafolio (KPIs + carga por persona) */
.sigso-py-resumen-ejecutivo { margin: var(--esp-3) 0 var(--esp-4); }
.sigso-py-resumen-ejecutivo summary { cursor: pointer; font-weight: 600; color: var(--texto); margin-bottom: var(--esp-3); }
.sigso-py-carga-titulo { margin: var(--esp-3) 0 var(--esp-2); }
.sigso-py-carga { display: flex; flex-direction: column; gap: var(--esp-2); }
.sigso-py-carga-fila { display: grid; grid-template-columns: 10rem 1fr auto; align-items: center; gap: var(--esp-2); font-size: var(--texto-sm); }
.sigso-py-carga-nombre { color: var(--texto); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sigso-py-carga-barra { background: var(--superficie-2); border-radius: var(--radio-sm); height: 0.5rem; overflow: hidden; }
.sigso-py-carga-barra span { display: block; height: 100%; background: var(--primario); border-radius: var(--radio-sm); }
.sigso-py-tarea__top, .sigso-py-hito__top {
  display: flex; align-items: center; justify-content: space-between; gap: var(--esp-2); flex-wrap: wrap;
}
.sigso-py-tarea__titulo, .sigso-py-hito__nombre { font-weight: 600; color: var(--texto); flex: 1; }
.sigso-btn--icono {
  background: none; border: none; cursor: pointer; padding: var(--esp-1); border-radius: var(--radio);
  color: var(--texto-3); display: inline-flex; align-items: center; flex-shrink: 0;
}
.sigso-btn--icono:hover { color: var(--primario); background: var(--fondo-hover, rgba(0,0,0,.06)); }
.sigso-py-tarea__meta {
  margin-top: var(--esp-1); font-size: var(--texto-sm); color: var(--texto-3);
  display: flex; gap: var(--esp-4); flex-wrap: wrap;
}
/* v10 (Fase B, "Mi trabajo en proyectos"): el nombre del proyecto, dentro de
   la meta de una tarea/entregable, es un enlace para volver a ese proyecto. */
.sigso-mt-link {
  background: none; border: none; padding: 0; margin: 0; font: inherit; font-size: inherit;
  color: var(--primario); cursor: pointer; text-decoration: underline; text-underline-offset: 2px;
}
.sigso-mt-link:hover { color: var(--primario-tinta); }

/* v10 (Fase B): toggle Lista/Tablero de la pestaña Tareas. */
/* El selector de vista del Cronograma (Dedicación · Plan · Historial ·
   Workload · Analítica). Sus 5 botones suman ~526px: en un móvil de 375
   estiraban la PAGINA ENTERA a 550px, en las cinco sub-vistas a la vez.
   Mismo remedio que .sigso-tabs, que tiene once pestañas y no desborda:
   la barra scrollea sola en vez de sacarle scroll horizontal al body.
   flex-shrink:0 es imprescindible -- sin el, los botones se comprimen
   hasta partir sus etiquetas en vez de desbordar hacia el scroll. */
.sigso-py-vista-toggle {
  display: flex;
  gap: var(--esp-2);
  overflow-x: auto;
  scrollbar-width: thin;
  -webkit-overflow-scrolling: touch;
}
.sigso-py-vista-toggle > * { flex-shrink: 0; }

/* v10 (Fase B): tablero Kanban de tareas. Columnas de ancho minimo fijo
   dentro de un contenedor flex -- en desktop reparten el espacio disponible
   (flex-grow), en mobile se desbordan y quedan scrolleables horizontalmente
   solas, sin necesidad de una media query aparte. */
.sigso-kanban {
  display: flex; gap: var(--esp-3); overflow-x: auto; padding-bottom: var(--esp-2);
}
.sigso-kanban__columna {
  flex: 1 1 16rem; min-width: 16rem; background: var(--superficie-2);
  border-radius: var(--radio-md); padding: var(--esp-3);
  display: flex; flex-direction: column; gap: var(--esp-2);
  transition: background var(--mov-rapido), outline-color var(--mov-rapido);
}
.sigso-kanban__columna--sobre { outline: 2px dashed var(--primario); outline-offset: -2px; background: var(--primario-suave); }
/* v10 (auditoría G, visual): acento de color por columna -- una franja
   superior con el mismo semáforo del módulo, para leer el tablero de un
   vistazo (Por hacer=neutro, En curso=azul, Bloqueada=crítico, Lista=ok). */
.sigso-kanban__columna { border-top: 3px solid var(--borde-fuerte); }
.sigso-kanban__columna--EN_CURSO { border-top-color: var(--info); }
.sigso-kanban__columna--BLOQUEADA { border-top-color: var(--critico); }
.sigso-kanban__columna--LISTA { border-top-color: var(--ok); }
.sigso-kanban__titulo {
  margin: 0; font-size: 0.8rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.03em;
  color: var(--texto-2); display: flex; align-items: center; gap: var(--esp-2);
}
.sigso-kanban__cuenta {
  font-weight: 700; text-transform: none; letter-spacing: 0; margin-left: auto;
  min-width: 1.4rem; height: 1.4rem; padding: 0 0.35rem; border-radius: var(--radio-full);
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--superficie); color: var(--texto-2); font-size: var(--texto-xs);
}
.sigso-kanban__tarjetas { display: flex; flex-direction: column; gap: var(--esp-2); min-height: 3rem; }
.sigso-kanban__vacia { text-align: center; padding: var(--esp-3) 0; margin: 0; }
.sigso-kanban__tarjeta {
  background: var(--superficie); border: 1px solid var(--borde); border-radius: var(--radio-md); padding: var(--esp-3);
}
.sigso-kanban__tarjeta--arrastrable { cursor: grab; }
.sigso-kanban__tarjeta--arrastrable:active { cursor: grabbing; }
.sigso-kanban__tarjeta--arrastrando { opacity: .5; }

/* v11 ("mejoras visuales del módulo", Kanban en celular): en mobile, 4
   columnas de 16rem mínimo (64rem ≈ 1024px en total) obligaban a un scroll
   HORIZONTAL del tablero completo -- incómodo en una pantalla que ya
   scrollea todo lo demás verticalmente. Por debajo de 640px las columnas
   se apilan a ancho completo, una tras otra: se sigue scrolleando la
   página como siempre, sin un segundo scroll horizontal anidado. El
   arrastre HTML5 (poco práctico en touch de todas formas) sigue existiendo
   arriba de esta resolución; en mobile las 4 pastillas de cada tarjeta ya
   son el camino principal para mover una tarea de columna. */
@media (max-width: 640px) {
  .sigso-kanban { flex-direction: column; overflow-x: visible; }
  .sigso-kanban__columna { min-width: 0; width: 100%; }
}

/* v11 (P2, "Gantt navegable"): línea de tiempo en píxeles-por-día real (zoom
   de verdad, no solo "encoger para que quepa"), con la columna de etiquetas
   FIJA (position:sticky) mientras el eje de tiempo se desplaza horizontal.
   Las clases de color por estado (--al-dia/--atrasada/etc. y las de hito)
   son las MISMAS de la v10 (Fase C) -- solo cambió el contenedor. */
.sigso-py-gantt-scroll { overflow-x: auto; border: 1px solid var(--borde); border-radius: var(--radio-sm); }
.sigso-py-gantt-body { display: inline-flex; flex-direction: column; position: relative; min-width: 100%; }
.sigso-py-gantt-fila { display: flex; align-items: stretch; border-bottom: 1px solid var(--borde); position: relative; z-index: 1; }
.sigso-py-gantt-fila:last-child { border-bottom: none; }
.sigso-py-gantt-fila--regla { position: sticky; top: 0; z-index: 3; background: var(--superficie); border-bottom: 1px solid var(--borde-fuerte); }
.sigso-py-gantt-etiqueta {
  /* 240px fijo A PROPÓSITO (no rem): el JS (PLAN_ETIQUETA_ANCHO_PX_) calcula
     dónde cae la línea de "Hoy" y las bandas de fin de semana sumando este
     mismo número de píxeles -- si esto se mueve, hay que mover esa constante. */
  flex: 0 0 240px; width: 240px; position: sticky; left: 0; z-index: 2; background: var(--superficie);
  padding: 0.35rem var(--esp-2); font-size: var(--texto-sm); color: var(--texto);
  display: flex; flex-direction: column; justify-content: center; gap: 1px;
  border-right: 1px solid var(--borde-fuerte); min-width: 0;
}
/* v12: la etiqueta ahora es título + una subfila de meta (semáforo + persona
   + fecha comprometida). El título trunca; la meta es más chica y tenue. */
.sigso-py-gantt-etiqueta__titulo { display: flex; align-items: center; gap: 0.3rem; font-weight: 600; min-width: 0; }
.sigso-py-gantt-etiqueta__titulo > span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* El boton de reprogramar del Gantt (alternativa por teclado al arrastre).
   flex-shrink:0 es lo que impide que un titulo largo lo comprima hasta
   desaparecer: el titulo YA se recorta con puntos suspensivos, asi que el
   espacio lo cede el, no el boton. */
.sigso-py-gantt-reprog {
  flex: 0 0 auto; margin-left: auto;
  /* 24x24 es el minimo recomendado para un objetivo tactil. El icono hereda
     su tamaño de .sigso-py-ded-reprogramar (0.8rem) y quedaba en 22x13: se
     puede apuntar con un mouse, no con un dedo. Se agranda el AREA, no el
     icono, para no alterar la densidad visual de la fila. */
  min-width: 24px; min-height: 24px;
  display: inline-flex; align-items: center; justify-content: center;
}
.sigso-py-gantt-etiqueta__meta {
  display: flex; align-items: center; gap: 0.3rem; font-size: var(--texto-xs); color: var(--texto-3);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.sigso-py-gantt-etiqueta__punto { flex: 0 0 auto; width: 8px; height: 8px; border-radius: 50%; }
.sigso-py-gantt-track { position: relative; height: 2.9rem; flex: 0 0 auto; }

/* Linea base congelada: riel fino DEBAJO de la barra real.

   Debajo y no detras: detras seria mas literal, pero con fechas iguales
   queda oculta y con fechas distintas se ve a medias tapada. Un riel
   propio siempre se ve entero y la comparacion se lee de un vistazo.

   El color dice el sentido del corrimiento: gris si no se movio, ambar si
   la tarea se fue mas tarde, verde si se adelanto. */
.sigso-py-gantt-base {
  position: absolute; bottom: 3px; height: 4px;
  border-radius: 2px; min-width: 4px;
  background: color-mix(in srgb, var(--texto-3, #94a3b8) 55%, transparent);
}
.sigso-py-gantt-base--atrasa { background: color-mix(in srgb, var(--alerta) 60%, transparent); }
.sigso-py-gantt-base--adelanta { background: color-mix(in srgb, var(--ok) 55%, transparent); }

/* G-01: conectores de dependencia. Capa SVG sobre las barras, dentro del
   mismo body -- asi scrollea con el Gantt sin recalcular nada.

   pointer-events:none es OBLIGATORIO: sin eso la capa se come el mousedown
   del handle de resize y arrastrar para reprogramar deja de funcionar.

   z-index 2 la deja por encima de las filas (z-index 1). Va encima a
   proposito: la punta de flecha tiene que tocar el borde de la barra para
   que se lea a donde llega. */
.sigso-py-gantt-deps {
  position: absolute; top: 0; left: 0;
  pointer-events: none; z-index: 2; overflow: visible;
}
.sigso-py-gantt-deps path { fill: none; }
.sigso-py-gantt-dep {
  stroke: var(--texto-3, #94a3b8);
  stroke-width: 1.5; opacity: 0.55;
  transition: opacity .12s ease, stroke .12s ease;
}
.sigso-py-gantt-deps marker path { fill: var(--texto-3, #94a3b8); stroke: none; }
.sigso-py-gantt-dep--critica { stroke: var(--critico); opacity: 0.75; stroke-width: 2; }

/* Al enfocar una barra, el resto se apaga y su cadena queda sola. */
.sigso-py-gantt-deps--enfocando .sigso-py-gantt-dep { opacity: 0.12; }
.sigso-py-gantt-deps--enfocando .sigso-py-gantt-dep--activa {
  opacity: 1; stroke: var(--primario); stroke-width: 2.5;
}

@media (prefers-reduced-motion: reduce) {
  .sigso-py-gantt-dep { transition: none; }
}
.sigso-py-gantt-track--regla { height: 1.9rem; }
.sigso-py-gantt-tick {
  position: absolute; top: 0; bottom: 0; border-left: 1px solid var(--borde-fuerte); padding-left: 4px;
  font-size: var(--texto-xs); color: var(--texto-2); white-space: nowrap; display: flex; align-items: center; font-weight: 600;
}
/* v12: capa de fondo (bandas de fin de semana + línea de meses) detrás de
   todas las filas -- hija directa del body, top/bottom 0 la estira a todo el
   alto. z-index bajo la deja detrás de las barras (que van en filas con
   z-index 1). */
.sigso-py-gantt-fondo { position: absolute; top: 0; bottom: 0; z-index: 0; pointer-events: none; }
.sigso-py-gantt-weekend { position: absolute; top: 0; bottom: 0; background: color-mix(in srgb, var(--texto) 5%, transparent); }
.sigso-py-gantt-mesline { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--borde); }
.sigso-py-gantt-hoy {
  position: absolute; top: 0; bottom: 0; width: 2px; background: var(--primario); z-index: 2; pointer-events: none;
}
.sigso-py-gantt-hoy-pill {
  position: absolute; top: 0; transform: translateX(-50%); z-index: 3; pointer-events: none;
  background: var(--primario); color: #fff; font-size: 0.6rem; font-weight: 700; line-height: 1;
  padding: 2px 5px; border-radius: 0 0 var(--radio-sm) var(--radio-sm); letter-spacing: 0.02em;
}
.sigso-py-cron-barra { position: absolute; top: 22%; height: 56%; border-radius: var(--radio-sm); min-width: 3px; display: flex; align-items: center; overflow: hidden; box-shadow: inset 0 0 0 1px color-mix(in srgb, black 8%, transparent); }
/* v12: relleno de avance dentro de la barra (una capa más oscura del mismo
   color) + fecha comprometida al final de la barra. */
.sigso-py-cron-barra__fill { position: absolute; top: 0; left: 0; bottom: 0; background: color-mix(in srgb, black 22%, transparent); border-radius: inherit; }
/* Chip de fecha comprometida: hijo del TRACK (no de la barra, que recorta),
   posicionado en el extremo derecho de la barra vía `left` inline. */
.sigso-py-gantt-fecha { position: absolute; top: 50%; transform: translateY(-50%); font-size: var(--texto-xs); color: var(--texto-3); white-space: nowrap; font-variant-numeric: tabular-nums; pointer-events: none; }
.sigso-py-cron-barra__txt { position: relative; z-index: 1; padding: 0 6px; font-size: var(--texto-xs); font-weight: 700; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 1px 1px color-mix(in srgb, black 30%, transparent); }
.sigso-py-cron-barra--al-dia, .sigso-py-cron-barra--terminada { background: var(--ok); }
.sigso-py-cron-barra--riesgo { background: var(--alerta); }
.sigso-py-cron-barra--atrasada { background: var(--critico); }
.sigso-py-cron-barra--bloqueada { background: var(--info); }
.sigso-py-cron-barra--pendiente, .sigso-py-cron-barra--cancelada { background: var(--texto-3); }
.sigso-py-cron-barra--revision { background: var(--primario); }
.sigso-py-cron-barra--atraso {
  background: repeating-linear-gradient(45deg, var(--critico), var(--critico) 4px, color-mix(in srgb, var(--critico), black 25%) 4px, color-mix(in srgb, var(--critico), black 25%) 8px);
}
.sigso-py-cron-hito {
  position: absolute; top: 50%; width: 12px; height: 12px; transform: translate(-50%, -50%) rotate(45deg);
  border-radius: 2px; background: var(--ok);
}
.sigso-py-cron-hito--atrasada { background: var(--critico); }
.sigso-py-cron-hito--terminada { background: var(--texto-3); }
.sigso-py-cron-hito--cancelada { background: var(--texto-3); opacity: .6; }

/* v11 (P2, "drag & drop de fechas"): el handle solo existe si la tarea es
   editable -- una franja angosta en el borde derecho de la barra, cursor de
   resize, visible al pasar el mouse (no compite visualmente con la barra en
   reposo). Mientras se arrastra, la barra se aclara para que el "fantasma"
   de la nueva duración se lea con claridad. */
.sigso-py-gantt-barra--editable { padding-right: 6px; }
.sigso-py-gantt-resize {
  position: absolute; top: 0; right: 0; bottom: 0; width: 6px; cursor: ew-resize;
  background: color-mix(in srgb, currentColor 35%, transparent); border-radius: 0 var(--radio-sm) var(--radio-sm) 0;
  opacity: 0; transition: opacity 0.1s;
}
.sigso-py-gantt-barra--editable:hover .sigso-py-gantt-resize,
.sigso-py-gantt-barra--arrastrando .sigso-py-gantt-resize { opacity: 1; }
.sigso-py-gantt-barra--arrastrando { opacity: 0.75; outline: 2px dashed var(--primario); outline-offset: 1px; }

/* v13 (Fase 1, "ruta crítica"): al activar el toggle, la cadena que determina
   la duración del proyecto se resalta con un anillo sólido; las tareas con
   holgura se atenúan para que la ruta lea sola. */
.sigso-py-gantt-barra--critica {
  outline: 2px solid var(--critico); outline-offset: 1px;
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--critico) 22%, transparent);
  z-index: 2;
}
.sigso-py-gantt-barra--holgada { opacity: 0.38; }
.sigso-py-gantt-critica-chip {
  display: inline-block; margin-left: 6px; padding: 0 6px; border-radius: 999px;
  font-size: 10px; font-weight: 700; letter-spacing: .03em; text-transform: uppercase;
  color: #fff; background: var(--critico); vertical-align: middle;
}

/* v10 (Fase E, "Carta Gantt de Dedicación"): grilla tarea x dia, leida de
   ACTIVIDADES_BITACORA (el check-in de siempre) -- ningun estado se marca a
   mano. Misma paleta semantica que el resto del modulo (--ok/--alerta/
   --critico/--info), sin colores nuevos; "asignada" es la unica marca sin
   equivalente previo, por eso usa el acento primario en vez de semaforo. */
/* Barra de controles de la carta (rango, nav, filtros, imprimir). */
.sigso-py-ded-controles { display: flex; align-items: center; gap: var(--esp-2); margin-bottom: var(--esp-3); flex-wrap: wrap; }
.sigso-py-ded-controles .sigso-py-ded-ctrl { margin: 0; }
.sigso-py-ded-controles .sigso-py-ded-ctrl select { min-width: 8.5rem; }
.sigso-py-ded-controles .sigso-boton { flex: 0 0 auto; }
.sigso-py-ded-rangotxt { font-variant-numeric: tabular-nums; }
.sigso-py-ded-controles .js-py-ded-imprimir { margin-left: auto; }
/* El botón de imprimir ahora vive envuelto en un <span title> (para el
   tooltip del consejo de impresión) -- el margen-auto que lo empuja a la
   derecha del toolbar debe vivir en ese wrapper, que es el hijo directo del
   flex container ahora, no en el botón. */
.sigso-py-ded-controles > span:has(> .js-py-ded-imprimir) { margin-left: auto; }
/* v11 (P1): nota + botón de "congelar línea base", agrupados a la derecha
   junto con Descargar/Imprimir. */
.sigso-py-ded-baseline { display: flex; align-items: center; gap: var(--esp-2); }
/* v11 (P1): botón 📅 de reprogramar, inline junto al título de la tarea --
   discreto hasta el hover/foco (no compite con el texto). */
.sigso-py-ded-reprogramar { border: none; background: none; cursor: pointer; padding: 0 2px; font-size: 0.8rem; opacity: 0.55; border-radius: var(--radio-sm); line-height: 1; }
.sigso-py-ded-reprogramar:hover, .sigso-py-ded-reprogramar:focus-visible { opacity: 1; background: var(--superficie-2); }

.sigso-py-ded-nav { display: flex; align-items: center; gap: var(--esp-3); margin-bottom: var(--esp-3); flex-wrap: wrap; }
.sigso-py-ded-scroll { overflow-x: auto; }
/* Ancho de columnas como variables: --dias lo inyecta el JS (cuántos días
   trae el rango), y las filas comparten la misma plantilla de grilla. */
.sigso-py-ded { display: flex; flex-direction: column; gap: 2px; min-width: max-content; --dias: 14; --col-tarea: 12rem; --col-dia: 1.9rem; --col-total: 3.4rem; }
.sigso-py-ded-fila {
  display: grid; grid-template-columns: var(--col-tarea) repeat(var(--dias), var(--col-dia)) var(--col-total);
  gap: 2px; align-items: center;
}
.sigso-py-ded-cabecera { margin-bottom: var(--esp-1); }
.sigso-py-ded-etiqueta { padding-right: var(--esp-2); display: flex; flex-direction: column; min-width: 0;
  /* v12.3: riel de color por semáforo (transparente por defecto -> cabecera,
     pie, subtotal y workload quedan sin riel pero ALINEADOS con las tareas). */
  border-left: 3px solid transparent; padding-left: 0.5rem; border-radius: 3px 0 0 3px;
}
.sigso-py-ded-fila--sem-al-dia > .sigso-py-ded-etiqueta,
.sigso-py-ded-fila--sem-terminada > .sigso-py-ded-etiqueta { border-left-color: var(--ok); }
.sigso-py-ded-fila--sem-riesgo > .sigso-py-ded-etiqueta { border-left-color: var(--alerta); }
.sigso-py-ded-fila--sem-atrasada > .sigso-py-ded-etiqueta { border-left-color: var(--critico); }
.sigso-py-ded-fila--sem-bloqueada > .sigso-py-ded-etiqueta { border-left-color: var(--info); }
.sigso-py-ded-fila--sem-revision > .sigso-py-ded-etiqueta { border-left-color: var(--primario); }
.sigso-py-ded-fila--sem-pendiente > .sigso-py-ded-etiqueta,
.sigso-py-ded-fila--sem-cancelada > .sigso-py-ded-etiqueta { border-left-color: var(--texto-3); }
.sigso-py-ded-etiqueta .t { font-size: var(--texto-sm); color: var(--texto); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sigso-py-ded-etiqueta .m { font-size: var(--texto-xs); color: var(--texto-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sigso-py-ded-dia {
  text-align: center; font-size: var(--texto-xs); color: var(--texto-3); font-variant-numeric: tabular-nums;
  padding-bottom: 0.2rem;
}
/* v12.2 ("marcar fin de semana / feriado"): la columna del día no laboral se
   tiñe DE VERDAD (antes casi imperceptible) -- para no registrar por error un
   sábado/domingo o un feriado. Cabecera con fondo tintado + número en negrita;
   las celdas vacías de esa columna llevan el mismo tinte (los días CON horas
   igual muestran su heatmap, que gana en la cascada). Fin de semana = gris
   frío neutro (no compite con los colores de estado); feriado = ámbar. */
.sigso-py-ded-dia.we { color: var(--texto-2); font-weight: 600; background: color-mix(in srgb, var(--texto-2) 13%, transparent); border-radius: 5px 5px 0 0; }
.sigso-py-ded-dia.feriado { color: var(--alerta); font-weight: 600; background: color-mix(in srgb, var(--alerta) 16%, transparent); border-radius: 5px 5px 0 0; }
.sigso-py-ded-dia.hoy { color: var(--primario); font-weight: 600; }
.sigso-py-ded-dia.mes { border-left: 2px solid var(--borde-fuerte); }
.sigso-py-ded-dia b { display: block; font-size: 0.55rem; text-transform: uppercase; letter-spacing: 0.02em; color: var(--texto-3); }
/* Columna de totales (por tarea, cabecera y pie). */
.sigso-py-ded-total {
  font-size: var(--texto-xs); font-variant-numeric: tabular-nums; color: var(--texto-2);
  text-align: right; padding-left: 0.2rem; white-space: nowrap; font-weight: 600;
}
.sigso-py-ded-cabecera .sigso-py-ded-total { color: var(--texto-3); font-weight: 600; text-transform: uppercase; font-size: 0.6rem; letter-spacing: 0.03em; }
.sigso-py-ded-celda {
  aspect-ratio: 1 / 1; border-radius: var(--radio-sm); background: var(--superficie-2); --hcol: var(--info);
  display: flex; align-items: center; justify-content: center;
}
.sigso-py-ded-celda.we { background: color-mix(in srgb, var(--texto-2) 12%, var(--superficie-2)); }
.sigso-py-ded-celda.feriado { background: color-mix(in srgb, var(--alerta) 15%, var(--superficie-2)); }
.sigso-py-ded-celda.hoy { outline: 2px solid var(--primario); outline-offset: -2px; }
.sigso-py-ded-celda span { font-size: 0.65rem; font-weight: 700; line-height: 1; }
.sigso-py-ded-celda.e-asig { background: var(--primario-suave); color: var(--primario); --hcol: var(--primario); }
.sigso-py-ded-celda.e-proc { background: var(--info-suave); color: var(--info); --hcol: var(--info); }
.sigso-py-ded-celda.e-done { background: var(--ok-suave); color: var(--ok); --hcol: var(--ok); }
.sigso-py-ded-celda.e-wait { background: var(--superficie-2); color: var(--texto-3); border: 1px dashed var(--borde-fuerte); }
.sigso-py-ded-celda.e-bloq { background: var(--critico-suave); color: var(--critico); --hcol: var(--critico); }
.sigso-py-ded-celda.e-late { background: var(--alerta-suave); color: var(--alerta); --hcol: var(--alerta); }
/* v11 (P0): estados-del-día explícitos que no existían al derivar del
   check-in -- planificado, en pausa, en revisión, esperando a un tercero. */
.sigso-py-ded-celda.e-plan { background: color-mix(in srgb, var(--primario-suave), var(--superficie) 45%); color: var(--primario); --hcol: var(--primario); border: 1px dashed color-mix(in srgb, var(--primario) 45%, transparent); }
.sigso-py-ded-celda.e-pausa { background: var(--superficie-2); color: var(--texto-2); --hcol: var(--texto-3); border: 1px solid var(--borde-fuerte); }
.sigso-py-ded-celda.e-rev { background: color-mix(in srgb, var(--alerta-suave), var(--superficie) 25%); color: var(--alerta); --hcol: var(--alerta); }
.sigso-py-ded-celda.e-esp { background: var(--superficie-2); color: var(--texto-3); border: 1px dashed var(--info); }
/* v11 (P0): celda editable (registro del día). Afordancia solo al pasar el
   mouse / enfocar, para no ensuciar la grilla; el "+" invita en celdas
   vacías. El anillo ".reg" marca un día CON registro explícito (distinto de
   una marca derivada del check-in). */
.sigso-py-ded-celda--edit { cursor: pointer; }
.sigso-py-ded-celda--edit:hover { outline: 2px solid var(--primario); outline-offset: -2px; }
.sigso-py-ded-celda--edit:focus-visible { outline: 2px solid var(--primario); outline-offset: 1px; }
.sigso-py-ded-celda--edit:hover:empty::after { content: '+'; color: var(--texto-3); font-size: 0.7rem; font-weight: 700; }
.sigso-py-ded-celda.reg { box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--texto) 22%, transparent); }
/* Heatmap: la intensidad de fondo crece con las horas del día (h1..h4).
   Va DESPUÉS de las reglas e-* para ganar en orden de cascada. */
.sigso-py-ded-celda.h1 { background: color-mix(in srgb, var(--hcol) 22%, var(--superficie)); }
.sigso-py-ded-celda.h2 { background: color-mix(in srgb, var(--hcol) 45%, var(--superficie)); }
.sigso-py-ded-celda.h3 { background: color-mix(in srgb, var(--hcol) 68%, var(--superficie)); }
.sigso-py-ded-celda.h4 { background: color-mix(in srgb, var(--hcol) 92%, var(--superficie)); }
.sigso-py-ded-celda.h3 span, .sigso-py-ded-celda.h4 span { color: #fff; }
/* Fila de subtotal por persona (agrupar) y fila-pie de horas por día. */
.sigso-py-ded-grupo { margin-top: var(--esp-2); }
.sigso-py-ded-grupo .sigso-py-ded-etiqueta .t { font-weight: 700; color: var(--texto); }
.sigso-py-ded-grupo .sigso-py-ded-celda { background: transparent; }
/* v11 (P1): las celdas de workload SÍ quieren su heatmap de vuelta (misma
   especificidad de 2 clases que la regla de arriba -- gana por venir
   después en la cascada). */
.sigso-py-ded-celda--workload.h1 { background: color-mix(in srgb, var(--hcol) 22%, var(--superficie)); }
.sigso-py-ded-celda--workload.h2 { background: color-mix(in srgb, var(--hcol) 45%, var(--superficie)); }
.sigso-py-ded-celda--workload.h3 { background: color-mix(in srgb, var(--hcol) 68%, var(--superficie)); }
.sigso-py-ded-celda--workload.h4 { background: color-mix(in srgb, var(--hcol) 92%, var(--superficie)); }
.sigso-py-ded-celda--workload.h3 span, .sigso-py-ded-celda--workload.h4 span { color: #fff; }
.sigso-py-ded-footer { margin-top: var(--esp-1); border-top: 2px solid var(--borde-fuerte); padding-top: 2px; }
.sigso-py-ded-footer .sigso-py-ded-etiqueta .t { font-weight: 600; color: var(--texto-2); font-size: var(--texto-xs); text-transform: uppercase; letter-spacing: 0.03em; }
.sigso-py-ded-celda--total { background: transparent; }
.sigso-py-ded-celda--total span { font-size: 0.6rem; font-weight: 600; color: var(--texto-2); }
.sigso-py-ded-leyenda {
  display: flex; gap: var(--esp-4); flex-wrap: wrap; margin-top: var(--esp-3);
  font-size: var(--texto-xs); color: var(--texto-3); align-items: center;
}
.sigso-py-ded-leyenda span { display: inline-flex; align-items: center; gap: var(--esp-1); }
.sigso-py-ded-sw { display: inline-block; width: 0.8rem; height: 0.8rem; border-radius: 3px; background: var(--superficie-2); }
.sigso-py-ded-sw--asig { background: var(--primario-suave); border: 1px solid var(--primario); }
.sigso-py-ded-sw--proc { background: var(--info-suave); border: 1px solid var(--info); }
.sigso-py-ded-sw--done { background: var(--ok-suave); border: 1px solid var(--ok); }
.sigso-py-ded-sw--wait { background: var(--superficie-2); border: 1px dashed var(--borde-fuerte); }
.sigso-py-ded-sw--bloq { background: var(--critico-suave); border: 1px solid var(--critico); }
.sigso-py-ded-sw--late { background: var(--alerta-suave); border: 1px solid var(--alerta); }
.sigso-py-ded-sw--plan { background: color-mix(in srgb, var(--primario-suave), var(--superficie) 45%); border: 1px dashed var(--primario); }
.sigso-py-ded-sw--pausa { background: var(--superficie-2); border: 1px solid var(--borde-fuerte); }
.sigso-py-ded-sw--rev { background: color-mix(in srgb, var(--alerta-suave), var(--superficie) 25%); border: 1px solid var(--alerta); }
.sigso-py-ded-sw--esp { background: var(--superficie-2); border: 1px dashed var(--info); }
.sigso-py-ded-sw--we { background: color-mix(in srgb, var(--texto-2) 20%, var(--superficie)); border: 1px solid color-mix(in srgb, var(--texto-2) 35%, transparent); }
.sigso-py-ded-sw--feriado { background: color-mix(in srgb, var(--alerta) 24%, var(--superficie)); border: 1px solid var(--alerta); }
.sigso-py-ded-heatleg { display: inline-flex; align-items: center; gap: 3px; }
.sigso-py-ded-heatleg .hl { display: inline-block; width: 0.8rem; height: 0.8rem; border-radius: 3px; --hcol: var(--info); }
.sigso-py-ded-heatleg .hl.h1 { background: color-mix(in srgb, var(--hcol) 22%, var(--superficie)); }
.sigso-py-ded-heatleg .hl.h2 { background: color-mix(in srgb, var(--hcol) 45%, var(--superficie)); }
.sigso-py-ded-heatleg .hl.h3 { background: color-mix(in srgb, var(--hcol) 68%, var(--superficie)); }
.sigso-py-ded-heatleg .hl.h4 { background: color-mix(in srgb, var(--hcol) 92%, var(--superficie)); }
@media (max-width: 640px) {
  .sigso-py-ded { --col-tarea: 8rem; --col-dia: 1.6rem; --col-total: 2.8rem; }
}

/* v11 (P0): modal del registro del día. */
/* v12.5 ("rediseño del registro del día"): cabecera con la tarea + la fecha
   en bloque claro, estado como pills de color, y una barra de acciones
   moderna (Eliminar a la izquierda, Cancelar/Guardar a la derecha). */
.sigso-py-reg-modal { max-width: min(30rem, calc(100vw - 2rem)); }
.sigso-py-reg-cab { margin: 0 0 var(--esp-3); display: flex; flex-direction: column; gap: 2px; }
.sigso-py-reg-cab strong { font-size: 1rem; color: var(--texto); }
.sigso-py-reg-cab__fecha { font-size: var(--texto-sm); color: var(--texto-3); text-transform: capitalize; }
.sigso-py-reg-traza { margin: 0 0 var(--esp-3); padding: var(--esp-1) var(--esp-2); background: var(--superficie-2); border-radius: var(--radio-sm); }

/* Etiqueta de campo consistente con los <label> de los campos de siempre. */
.sigso-py-reg-campo-label { display: block; font-size: var(--texto-sm); color: var(--texto-2); font-weight: 600; margin-bottom: var(--esp-1); }
/* Pills de estado: una por estado, con el color de su semáforo como acento.
   Al seleccionar, la pill se rellena con su color. Un solo toque, sin abrir
   un dropdown -- más rápido para el uso diario. */
.sigso-py-reg-estados { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: var(--esp-3); }
.sigso-py-reg-pill {
  --acc: var(--info); font: inherit; font-size: 0.8rem; line-height: 1.2; padding: 5px 12px;
  border-radius: 999px; cursor: pointer; border: 1.5px solid var(--borde);
  background: var(--superficie); color: var(--texto-2); transition: border-color .12s, background .12s, color .12s;
}
.sigso-py-reg-pill:hover { border-color: var(--acc); color: var(--texto); }
.sigso-py-reg-pill:focus-visible { outline: none; box-shadow: var(--foco-anillo); }
.sigso-py-reg-pill.is-sel { background: var(--acc); border-color: var(--acc); color: #fff; font-weight: 600; }
.sigso-py-reg-pill--asig { --acc: var(--primario); }
.sigso-py-reg-pill--plan { --acc: var(--info); }
.sigso-py-reg-pill--proc { --acc: var(--info); }
.sigso-py-reg-pill--bloq { --acc: var(--critico); }
.sigso-py-reg-pill--pausa { --acc: var(--texto-3); }
.sigso-py-reg-pill--done { --acc: var(--ok); }
.sigso-py-reg-pill--rev { --acc: var(--alerta); }
.sigso-py-reg-pill--esp { --acc: var(--info); }

/* Barra de acciones del modal: Eliminar (peligro, sutil) a la izquierda;
   Cancelar + Guardar a la derecha. */
.sigso-py-reg-acciones { display: flex; align-items: center; gap: var(--esp-2); margin-top: var(--esp-4); }
.sigso-py-reg-acciones__der { display: flex; gap: var(--esp-2); margin-left: auto; }
.sigso-py-reg-eliminar {
  border: 1.5px solid transparent; background: none; cursor: pointer; font: inherit; font-size: 0.85rem;
  color: var(--critico); padding: 7px 12px; border-radius: var(--radio-sm); transition: background .12s, border-color .12s, color .12s;
}
.sigso-py-reg-eliminar:hover { background: var(--critico-suave); border-color: color-mix(in srgb, var(--critico) 30%, transparent); }
.sigso-py-reg-eliminar.is-armado { background: var(--critico); color: #fff; font-weight: 600; border-color: var(--critico); }
.sigso-py-reg-eliminar:disabled { opacity: .6; cursor: default; }
.sigso-py-reg-tramos { margin: var(--esp-2) 0; }
.sigso-py-reg-tramos__cab { display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--esp-1); font-size: var(--texto-xs); color: var(--texto-2); text-transform: uppercase; letter-spacing: 0.03em; }
.sigso-py-reg-tramo { display: flex; gap: var(--esp-1); align-items: center; margin-bottom: var(--esp-1); }
.sigso-py-reg-tramo .js-py-reg-tramo-desde, .sigso-py-reg-tramo .js-py-reg-tramo-hasta { max-width: 6.5rem; }
.sigso-py-reg-tramo .js-py-reg-tramo-nota { flex: 1 1 auto; min-width: 0; }
.sigso-py-reg-tramo-quitar { flex: 0 0 auto; padding: 0 0.6rem; line-height: 1.6; }

/* v11 ("PDF ejecutivo configurable"): checkboxes de secciones en grilla de
   2 columnas -- son 12 opciones, una lista vertical sería demasiado larga. */
.sigso-py-informe-secciones { display: grid; grid-template-columns: 1fr 1fr; gap: var(--esp-1) var(--esp-3); margin-bottom: var(--esp-3); }
@media (max-width: 480px) { .sigso-py-informe-secciones { grid-template-columns: 1fr; } }

/* v11 (P3, "analítica avanzada"): tabla simple lead/cycle/bloqueo/revisión
   por tarea -- mismo contenedor con scroll horizontal que ya usa la carta
   de Dedicación (.sigso-py-ded-scroll), para no desbordar en mobile. */
.sigso-py-analitica-acciones { margin: var(--esp-2) 0; }
.sigso-py-analitica-tabla { width: 100%; border-collapse: collapse; font-size: var(--texto-sm); }
.sigso-py-analitica-tabla th, .sigso-py-analitica-tabla td { padding: var(--esp-1) var(--esp-2); border-bottom: 1px solid var(--borde); text-align: left; white-space: nowrap; }
.sigso-py-analitica-tabla th { color: var(--texto-3); font-size: var(--texto-xs); text-transform: uppercase; letter-spacing: 0.03em; font-weight: 600; }
.sigso-py-analitica-tabla td:not(:first-child) { font-variant-numeric: tabular-nums; }

/* v11 (P1): feed de Historial -- reverso-cronológico, un ícono + frase +
   momento por fila. Deliberadamente sin tarjeta pesada por fila (es una
   lista larga, no tarjetas de portafolio); solo un hairline entre filas. */
.sigso-py-hist { display: flex; flex-direction: column; }
.sigso-py-hist-fila { display: flex; gap: var(--esp-2); padding: var(--esp-2) 0; border-bottom: 1px solid var(--borde); }
.sigso-py-hist-fila:last-child { border-bottom: none; }
.sigso-py-hist-icono { flex: 0 0 auto; width: 1.75rem; height: 1.75rem; border-radius: 50%; background: var(--superficie-2); display: flex; align-items: center; justify-content: center; font-size: 0.9rem; }
.sigso-py-hist-cuerpo { min-width: 0; flex: 1 1 auto; }
.sigso-py-hist-frase { color: var(--texto); line-height: 1.5; }
.sigso-py-hist-cambio { font-weight: 600; color: var(--primario); }
.sigso-py-hist-cuando { margin-top: 2px; font-size: var(--texto-xs); color: var(--texto-3); }

/* v11 (P1): score de salud numérico junto al semáforo de siempre. */
/* v11 ("mejoras visuales del módulo"): antes usaba --texto-3 (gris plano) a
   proposito -- pero DENTRO de la píldora de salud, coloreada según el
   estado (--ok/--alerta/--critico), un gris ajeno se leía como un error de
   estilo, no como un número secundario. `inherit` + opacidad hace que el
   score sea la MISMA tinta que la etiqueta, solo más suave -- una sola
   unidad de color, no dos piezas sueltas. */
.sigso-py-salud-score { margin-left: var(--esp-1); font-variant-numeric: tabular-nums; color: inherit; opacity: 0.75; font-size: var(--texto-xs); }

/* v11 (P1): nota de Plan/Esperado/Real bajo el título de cada tarea en la
   carta de Dedicación -- compacta, monoespaciada donde hay números para que
   alineen al ojo entre filas. */
/* v12.3 ("rediseño"): Plan/Esperado/Real/desviación como CHIPS (antes una
   línea de texto apretada con "·"). */
.sigso-py-ded-plan { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 4px; }
.sigso-py-plan-chip {
  font-size: 0.68rem; line-height: 1.4; padding: 1px 7px; border-radius: 999px;
  background: var(--superficie-2); color: var(--texto-2); font-variant-numeric: tabular-nums; white-space: nowrap;
}
.sigso-py-plan-chip--base { background: var(--alerta-suave); color: var(--alerta); }
.sigso-py-plan-chip--dev { font-weight: 700; }
.sigso-py-plan-chip--dev.is-favor { background: var(--ok-suave); color: var(--ok); }
.sigso-py-plan-chip--dev.is-contra { background: var(--critico-suave); color: var(--critico); }

/* v11 (P1): fila de workload por persona (agrupar) -- total diario propio +
   marca de sobrecarga cuando supera la jornada. */
.sigso-py-ded-celda--sobrecarga { box-shadow: inset 0 0 0 2px var(--critico); }
.sigso-py-ded-grupo .sigso-py-ded-total { font-weight: 700; }

/* Vista imprimible de la carta (Descargar / Imprimir). En pantalla el
   contenedor está oculto; en impresión se oculta todo lo demás y la carta
   se dibuja en horizontal, con los colores forzados a imprimirse. */
#sigso-print-root { display: none; }
.sigso-print-cab h1 { margin: 0 0 2px; font-size: 1.2rem; }
.sigso-print-cab .sigso-print-proy { margin: 0; font-weight: 600; }
.sigso-print-cab .sigso-print-sub { margin: 0 0 var(--esp-3); color: var(--texto-3); font-size: var(--texto-xs); }
@media print {
  @page { size: landscape; margin: 1.1cm; }
  body.sigso-imprimiendo > *:not(#sigso-print-root) { display: none !important; }
  body.sigso-imprimiendo #sigso-print-root { display: block; color: #000; }
  #sigso-print-root, #sigso-print-root * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  #sigso-print-root .sigso-py-ded-scroll { overflow: visible; }
  #sigso-print-root .sigso-py-ded { --col-tarea: 9rem; --col-dia: 1.15rem; --col-total: 2.8rem; font-size: 9px; }
  #sigso-print-root .sigso-py-ded-celda span { font-size: 8px; }
  /* En pantalla la carta es un grid de <div> por fila (hace falta para el
     drag&drop, el click-para-registrar y demás) -- pero un grid NO repite su
     fila de cabecera al saltar de página al imprimir: una carta de 2+
     páginas dejaba la 2a/3a SIN los números de día, así que las marcas de
     cada tarea quedaban sin poder saber a qué día correspondían. Acá, SOLO
     dentro de la copia impresa (nunca toca la pantalla), se reconstruye la
     MISMA marca como tabla CSS -- ningún <table> nuevo, solo display:table*
     -- para que el navegador repita cabecera y pie en cada hoja gratis. */
  #sigso-print-root .sigso-py-ded {
    display: table; table-layout: fixed; border-collapse: separate; border-spacing: 0 2px; width: auto;
  }
  #sigso-print-root .sigso-py-ded-fila { display: table-row; break-inside: avoid; }
  #sigso-print-root .sigso-py-ded-fila.sigso-py-ded-cabecera { display: table-header-group; }
  #sigso-print-root .sigso-py-ded-fila.sigso-py-ded-footer { display: table-footer-group; }
  #sigso-print-root .sigso-py-ded-etiqueta,
  #sigso-print-root .sigso-py-ded-dia,
  #sigso-print-root .sigso-py-ded-celda,
  #sigso-print-root .sigso-py-ded-total { display: table-cell; vertical-align: middle; }
  #sigso-print-root .sigso-py-ded-etiqueta { width: var(--col-tarea); text-align: left; vertical-align: top; padding: 1px 4px 3px 0; }
  #sigso-print-root .sigso-py-ded-etiqueta .t,
  #sigso-print-root .sigso-py-ded-etiqueta .m { display: block; }
  #sigso-print-root .sigso-py-ded-dia,
  #sigso-print-root .sigso-py-ded-celda { width: var(--col-dia); height: var(--col-dia); aspect-ratio: auto; text-align: center; }
  #sigso-print-root .sigso-py-ded-total { width: var(--col-total); text-align: right; }
  /* El botón 📅 de reprogramar es una acción de pantalla -- en un reporte
     para leer/imprimir no hace nada, solo ensucia el título de la tarea. */
  #sigso-print-root .sigso-py-ded-reprogramar { display: none; }
}

/* v10 (Fase C, "vista calendario"): grilla de mes, sin libreria -- mismo
   espiritu que el resto del modulo (CSS liso, sin dependencias nuevas). */
.sigso-py-cal-nav {
  display: flex; align-items: center; gap: var(--esp-2); margin: var(--esp-3) 0;
}
.sigso-py-cal-mes { font-weight: 600; color: var(--texto); text-transform: capitalize; min-width: 10rem; text-align: center; }
.sigso-py-cal-cabecera-dias {
  display: grid; grid-template-columns: repeat(7, 1fr); gap: var(--esp-1);
  font-size: var(--texto-sm); color: var(--texto-2); text-align: center; margin-bottom: var(--esp-1);
}
.sigso-py-cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: var(--esp-1); }
.sigso-py-cal-celda {
  aspect-ratio: 1 / 1; min-height: 3.5rem; background: var(--superficie); border: 1px solid var(--borde);
  border-radius: var(--radio-sm); padding: 0.35rem; display: flex; flex-direction: column; gap: 0.2rem;
  cursor: pointer; font: inherit; text-align: left; transition: border-color var(--mov-rapido), background var(--mov-rapido);
}
.sigso-py-cal-celda:hover { border-color: var(--borde-fuerte); }
.sigso-py-cal-celda--vacia { background: transparent; border-color: transparent; cursor: default; }
.sigso-py-cal-celda--hoy { border-color: var(--primario); }
.sigso-py-cal-celda--activa { background: var(--primario-suave); border-color: var(--primario); }
.sigso-py-cal-numero { font-size: var(--texto-sm); font-weight: 600; color: var(--texto); font-variant-numeric: tabular-nums; }
.sigso-py-cal-marcas { display: flex; align-items: center; gap: 0.2rem; flex-wrap: wrap; }
.sigso-py-cal-marca { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
.sigso-py-cal-marca--al-dia, .sigso-py-cal-marca--terminada { background: var(--ok); }
.sigso-py-cal-marca--riesgo { background: var(--alerta); }
.sigso-py-cal-marca--atrasada { background: var(--critico); }
.sigso-py-cal-marca--bloqueada { background: var(--info); }
.sigso-py-cal-marca--pendiente, .sigso-py-cal-marca--cancelada { background: var(--texto-3); }
.sigso-py-cal-marca--revision { background: var(--primario); }
.sigso-py-cal-extra { font-size: 0.65rem; color: var(--texto-2); }
.sigso-py-cal-panel { margin-top: var(--esp-4); }
@media (max-width: 640px) {
  .sigso-py-cal-celda { min-height: 2.75rem; padding: 0.25rem; }
  .sigso-py-cal-numero { font-size: 0.75rem; }
}

/* ===== v10.0: modulo Calidad / SGC ISO 9001 =============================
   Repositorio documental. Reusa los tokens de siempre; el unico acento
   propio es el codigo del documento en monoespaciada, porque en un SGC el
   codigo (DOC-01, PRO-07) ES la identidad del documento y se busca por el. */
.sgc-cabecera {
  display: flex; align-items: center; justify-content: space-between;
  gap: var(--esp-3); flex-wrap: wrap; margin-bottom: var(--esp-3);
}
.sgc-cabecera .sigso-ayuda { margin: 0; flex: 1 1 18rem; }

.sgc-filtros {
  display: flex; gap: var(--esp-2); align-items: center; flex-wrap: wrap;
  margin-bottom: var(--esp-4);
}
.sgc-filtros .sigso-campo { margin: 0; flex: 0 1 14rem; min-width: min(9rem, 100%); }

/* v16.0 — LISTA AGRUPADA (afecta a todas las pantallas de lista del módulo)
   Antes cada elemento era una tarjeta suelta con borde, radio de 12px y 8px
   de separación: 28 documentos ocupaban 2.252px de alto y el ancho quedaba
   desaprovechado. Un inventario se ESCANEA, no se contempla: ahora la lista
   es UNA superficie con filas separadas por una línea de 1px. Mismo dato,
   ~40% menos de scroll, y el ojo baja por un solo borde en vez de saltar
   entre 28 cajas. */
.sgc-lista {
  display: flex; flex-direction: column; gap: 0;
  background: var(--superficie);
  border: 1px solid var(--borde);
  border-radius: var(--radio-md);
  overflow: hidden;
}
.sgc-lista > .sgc-doc,
.sgc-lista > .sgc-version {
  border: 0; border-radius: 0;
  border-top: 1px solid var(--borde);
  background: transparent;
}
.sgc-lista > .sgc-doc:first-child,
.sgc-lista > .sgc-version:first-child { border-top: 0; }

/* v10.0 Tanda A: eficacia de capacitacion por participante, anidada dentro
   de la tarjeta del curso -- una fila compacta por persona, sin el borde
   completo de .sgc-version (ya esta dentro de una). */
.sgc-lista--anidada {
  margin-top: var(--esp-2); padding-top: var(--esp-2);
  border-top: 1px solid var(--borde); gap: var(--esp-1);
}
.sgc-lista--anidada .sgc-doc__top { padding: 2px 0; }

.sgc-doc, .sgc-version {
  background: var(--superficie); border: 1px solid var(--borde);
  border-radius: var(--radio-md); padding: var(--esp-3) var(--esp-4);
}
.sgc-doc {
  display: block; width: 100%; text-align: left; cursor: pointer;
  font: inherit; color: inherit;
  transition: background var(--mov-rapido);
}
.sgc-doc:hover { background: var(--superficie-2); }
.sgc-doc:focus-visible { outline: none; box-shadow: var(--foco-anillo); position: relative; z-index: 1; }

/* v16.0 — el color de la fila SIGNIFICA algo.
   Antes toda fila nacía con `border-left: 3px solid var(--ok)`: verde de
   "correcto" en absolutamente todo, incluidas las filas con problemas. Un
   color que aparece siempre no informa nada y encima gasta la señal. Ahora
   el rail sólo existe cuando hay un estado que mirar, y su color lo dice. */
.sgc-doc--pendiente { box-shadow: inset 3px 0 0 var(--alerta); }
.sgc-doc--critico   { box-shadow: inset 3px 0 0 var(--critico); }
.sgc-doc--obsoleto  { box-shadow: inset 3px 0 0 var(--texto-3); opacity: .68; }
.sgc-doc--ok        { box-shadow: inset 3px 0 0 var(--ok); }

/* La fila necesita respirar sin engordar: título + metadatos en ~58px,
   frente a los 71px (+8 de separación) de la tarjeta anterior. Con 28
   documentos eso son ~600px menos de scroll sin apretar el texto. */
.sgc-lista > .sgc-doc { padding: 10px var(--esp-4); }
.sgc-lista > .sgc-doc .sgc-doc__icono { width: 1.75rem; height: 1.75rem; }

/* v10.0 Fase 2 (cont.): icono por tipo, SOLO en el listado de Documentos
   (`.sgc-doc--con-icono`, un modificador -- `.sgc-doc` a secas lo reusan
   Personas/NC/Auditorias/Quejas/Proveedores/Revision/Objetivos/Cobertura
   con su estructura de siempre (top+meta apilados), y cambiar la clase base
   a flex les habria roto el layout a los ocho). Fondo neutro a proposito:
   el color de estado ya vive en el borde izquierdo y en los badges; darle
   color propio al icono competiria por atencion con esas dos senales. */
.sgc-doc--con-icono { display: flex; align-items: flex-start; gap: var(--esp-3); }
.sgc-doc__icono {
  flex: 0 0 auto; width: 2.125rem; height: 2.125rem; margin-top: 1px;
  display: flex; align-items: center; justify-content: center;
  border-radius: var(--radio-sm); background: var(--superficie-2); color: var(--texto-3);
}
.sgc-doc--obsoleto .sgc-doc__icono { color: var(--critico); }
.sgc-doc__cuerpo { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 2px; }

/* v16.0 — `.sgc-doc__linea` se usaba en 21 sitios del módulo (proveedores,
   revisiones, objetivos, indicadores, procesos, riesgos, contexto, alcance,
   cobertura, accesos, hitos) y NO EXISTÍA ni una regla para ella: esas filas
   caían a `display:block` y su contenido salía pegado, del tipo
   "07/09/2026NC-2026-001: corrección". Es la misma fila superior que
   `__top`, así que comparten estilo. */
.sgc-doc__top,
.sgc-doc__linea {
  display: flex; align-items: center; gap: var(--esp-2); flex-wrap: wrap;
}
/* v16.0 — el código deja de gritar.
   Antes iba en monoespaciada, negrita 700 y con el AZUL DE ACCIÓN: en cada
   fila, lo más llamativo era la referencia técnica (PRO-01) y no el nombre
   del documento. Se invierte: el nombre manda, el código acompaña. El azul
   se reserva para lo accionable, que es su trabajo en el sistema. */
.sgc-doc__codigo {
  font-family: ui-monospace, "SF Mono", "Cascadia Mono", Consolas, monospace;
  /* v16.3: era --texto-3 (2.95:1 medido -- bajo el minimo AA de 4.5:1 para
     texto normal). --texto-2 da 5.7:1, mismo tono que el resto de los
     metadatos del modulo (.sgc-seccion__ayuda, .sgc-hito__fecha...). */
  font-weight: 500; color: var(--texto-2); font-size: var(--texto-xs);
  letter-spacing: .01em; flex: 0 0 auto;
}
/* El nombre ENVUELVE, no se corta.
   En la v16 se probó `white-space: nowrap` + elipsis para dejar la fila en
   una línea. Falla en un flex con `flex-wrap: wrap`: el item no encoge por
   debajo de su contenido, salta de línea con su ancho completo y se sale del
   contenedor -- medido, 298px fuera de la fila en el mapa de procesos, donde
   los nombres son largos. Envolver nunca desborda y no esconde el dato que
   distingue un documento de otro. */
.sgc-doc__nombre {
  font-weight: 600; color: var(--texto); flex: 1 1 12rem; min-width: 0;
  overflow-wrap: anywhere;
}
.sgc-doc__meta {
  margin-top: 2px; font-size: var(--texto-xs); color: var(--texto-3);
  display: flex; gap: var(--esp-3); flex-wrap: wrap; align-items: center;
}
.sgc-doc--con-icono .sgc-doc__meta { margin-top: 0; }

.sgc-detalle-cab {
  display: flex; align-items: center; gap: var(--esp-3); flex-wrap: wrap;
  margin-bottom: var(--esp-3);
}
.sgc-detalle-cab h1 { margin: 0; flex: 1 1 auto; min-width: 10rem; }
/* v14.0: cargo como subtitulo de la ficha -- el diferenciador cuando la
   misma persona tiene mas de un cargo (misma cuenta, dos fichas). */
.sgc-detalle-subtitulo { margin: -0.4rem 0 var(--esp-3); color: var(--texto-2); font-size: var(--texto-sm); }
.sgc-cuerpo { margin-top: var(--esp-3); }
.sgc-sub { margin: var(--esp-5) 0 var(--esp-3); }

.sgc-ficha {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(min(11rem, 100%), 1fr));
  gap: var(--esp-3); margin: var(--esp-4) 0;
}
.sgc-ficha__campo { display: flex; flex-direction: column; gap: 2px; }
.sgc-ficha__campo dt {
  /* v16.3: medido en vivo -- 2.95:1, bajo el minimo AA (4.5:1) para texto
     normal. Afecta CADA etiqueta de la ficha (CORREO, RUT, CARGO, TIPO...).
     --texto-2 da 5.7:1 y es el mismo tono ya usado en el resto de las
     etiquetas del rediseño v16 (.sgc-seccion__ayuda, .sgc-hito__fecha). */
  font-size: var(--texto-xs); font-weight: 700; letter-spacing: .06em;
  text-transform: uppercase; color: var(--texto-2);
}
.sgc-ficha__campo dd { margin: 0; color: var(--texto); }

.sgc-acciones { display: flex; gap: var(--esp-2); flex-wrap: wrap; margin-top: var(--esp-4); }

/* v10.0 Fase 1b: confirmación de lectura. Va arriba del detalle porque es
   lo único que el personal operativo TIENE que hacer en este módulo. */
.sgc-acuse {
  border-radius: var(--radio-md); padding: var(--esp-3) var(--esp-4);
  margin-bottom: var(--esp-4); display: flex; align-items: center;
  gap: var(--esp-3); flex-wrap: wrap;
}
.sgc-acuse p { margin: 0; flex: 1 1 16rem; }
.sgc-acuse--pendiente { background: var(--alerta-suave); border: 1px solid var(--alerta); }
.sgc-acuse--hecho { background: var(--ok-suave); border: 1px solid var(--ok); color: var(--texto-2); }
.sgc-form-fila { display: flex; gap: var(--esp-3); flex-wrap: wrap; }
.sgc-form-fila > * { flex: 1 1 10rem; }

/* v10.0 Fase 3a: no conformidades. */
.sgc-kpis {
  display: grid; gap: var(--esp-3); margin: var(--esp-3) 0 var(--esp-4);
  grid-template-columns: repeat(auto-fit, minmax(min(9rem, 100%), 1fr));
}
.sgc-nc--vencida { border-left-color: var(--critico); background: var(--critico-suave); }

/* El ciclo de mejora es una secuencia: primero corregir, después entender
   por qué, después evitar que se repita, y al final comprobar que funcionó.
   Se pinta como pasos numerados porque el orden es la norma, no un detalle
   de presentación -- definir la acción antes de la causa es exactamente el
   error que la ISO 9001 §10.2 busca impedir. */
.sgc-etapas { display: flex; flex-direction: column; gap: var(--esp-3); margin: var(--esp-4) 0; }
.sgc-etapa {
  display: flex; gap: var(--esp-3); padding: var(--esp-4);
  background: var(--superficie); border: 1px solid var(--borde);
  border-radius: var(--radio-md);
}
.sgc-etapa__num {
  flex: 0 0 auto; width: 1.75rem; height: 1.75rem; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  background: var(--superficie-2); color: var(--texto-2);
  font-weight: 700; font-size: var(--texto-sm);
}
.sgc-etapa--hecha { border-color: var(--ok); }
.sgc-etapa--hecha .sgc-etapa__num { background: var(--ok-suave); color: var(--ok); }
.sgc-etapa__cuerpo { flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere; }
.sgc-etapa__cuerpo h3 { margin: 0 0 var(--esp-2); font-size: var(--texto-base); }
.sgc-etapa__cuerpo p { margin: 0 0 var(--esp-2); }
.sgc-etapa .sgc-acciones { margin-top: var(--esp-3); }

/* La tarea vinculada: el estado real lo dice la ACTIVIDAD que la persona ve
   en "Mi trabajo", no un campo copiado aquí. */
.sgc-tarea-vinculada {
  background: var(--superficie-2); border-radius: var(--radio-sm);
  padding: var(--esp-3); margin: var(--esp-2) 0;
}
.sgc-tarea-vinculada p { margin: 0 0 var(--esp-2); }
.sgc-porques { margin: 0 0 var(--esp-3); padding-left: var(--esp-5); color: var(--texto-2); }
.sgc-porques li { margin-bottom: 2px; }

/* v10.0 Fase 3b: auditoría interna. Reusa .sgc-etapa (el ciclo se pinta
   igual que el de una no conformidad) y agrega lo propio de la lista de
   verificación. */
.sgc-conteos { display: flex; gap: var(--esp-2); flex-wrap: wrap; margin-bottom: var(--esp-3); }
.sgc-hallazgos { display: flex; flex-direction: column; gap: var(--esp-2); }
.sgc-hallazgo {
  padding: var(--esp-3); border-radius: var(--radio-sm);
  background: var(--superficie-2); border-left: 3px solid var(--borde);
  overflow-wrap: anywhere;
}
.sgc-hallazgo p { margin: 0 0 var(--esp-2); }
.sgc-hallazgo .sgc-acciones { margin-top: 0; }
/* El color del borde dice el resultado sin tener que leer el badge. */
.sgc-hallazgo--conforme { border-left-color: var(--ok); }
.sgc-hallazgo--observacion { border-left-color: var(--alerta); }
.sgc-hallazgo--no_conformidad { border-left-color: var(--critico); }
.sgc-hallazgo--oportunidad { border-left-color: var(--info); }

/* Las 28 cláusulas de la norma no caben en una lista vertical sin volver
   el modal impracticable: se distribuyen en columnas y el bloque scrollea
   por dentro. */
.sgc-clausulas {
  border: 1px solid var(--borde); border-radius: var(--radio-sm);
  padding: var(--esp-3); margin-bottom: var(--esp-3);
  max-height: 15rem; overflow-y: auto;
  display: grid; gap: var(--esp-1);
  grid-template-columns: repeat(auto-fit, minmax(min(16rem, 100%), 1fr));
}
.sgc-clausulas legend { font-size: var(--texto-sm); color: var(--texto-2); padding: 0 var(--esp-2); }
.sgc-clausulas .sigso-campo-check { margin: 0; }

/* Con la quinta seccion (Auditorias) la barra dejo de caber en un movil y
   estiraba la pagina entera: .sigso-tabs es un flex sin wrap, asi que el
   ancho de la barra se volvia el ancho del contenido. Scrollea ella sola
   en vez de sacar scroll horizontal a la pagina. Envolver no sirve: dos
/* v12.0: aqui vivia la barra HORIZONTAL de secciones del SGC
   (.sgc-secciones / .sgc-nav-grupo / .sgc-nav-separador). La reemplazo la
   navegacion vertical .sigso-nav2 (ver el bloque al final de este archivo).
   El comentario que estaba aca describia el sintoma que la condeno: "con la
   quinta seccion la barra dejo de caber en un movil". Llego a dieciseis. */

/* Sub-nav de Accesos / Riesgos / Contexto: mismas pildoras, un punto mas
   chicas, sin icono -- viven DENTRO de un grupo ya identificado. Apunta a
   .sigso-tab (no a .js-acc-vista) para cubrir los TRES subnavs que usan este
   contenedor: Accesos (js-acc-vista), Riesgos/Oportunidades (js-rsg-vista) y
   Contexto/Partes (js-ctx-vista). Antes solo Accesos recibia la pildora; los
   otros dos caian al chrome nativo. Estas reglas (0,2,0 y 0,3,0) ganan al
   estilo base subrayado de .sigso-tab, asi que aca son pildoras y en
   Proyectos son pestañas subrayadas -- cada contexto con su forma. */
.sgc-subnav-accesos .sigso-tab {
  display: inline-flex; align-items: center; padding: .35rem .75rem;
  margin-bottom: 0;
  border-radius: 999px; border: 1px solid transparent; background: transparent;
  color: var(--texto-2); font-weight: 600; font-size: var(--texto-sm); cursor: pointer;
  white-space: nowrap; transition: background .15s, color .15s;
}
.sgc-subnav-accesos .sigso-tab:hover { background: var(--superficie-2); color: var(--texto); }
.sgc-subnav-accesos .sigso-tab.sigso-tab--activo { background: var(--primario); color: #fff; }

/* v10.0 Fase 2: tablero de KPIs sobre el listado de Documentos -- lo
