<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SIGSO v2 — Sistema visual (interno)</title>
  <!-- styleguide-v2.html — contrato visual del sistema v2 (clase raíz .sx2),
       piloto Proyectos v2. Página interna, no enlazada desde ninguna otra.
       Todo se pinta con UIv2 (los mismos generadores que usa el módulo), así
       que si algo se ve mal aquí, está mal en el sistema. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/v2/tokens-v2.css" />
  <link rel="stylesheet" href="css/v2/layout-v2.css" />
  <link rel="stylesheet" href="css/v2/componentes-v2.css" />
  <link rel="stylesheet" href="css/v2/movimiento-v2.css" />
  <style>
    body { margin: 0; }
    .sg2-bloque { display: flex; flex-direction: column; gap: 12px; }
    .sg2-rotulo { font: 600 0.6875rem/1.2 var(--fuente); text-transform: uppercase; letter-spacing: .08em; color: var(--texto-3); margin: 0; }
    .sg2-fila { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  </style>
</head>
<body>
  <div class="sx2" id="raiz"></div>

  <script src="js/components.js"></script>
  <script src="js/iconos.js"></script>
  <script src="js/ui-v2.js"></script>
  <script>
    (function () {
      var U = UIv2;
      var personas = [
        { nombre: 'Valentina Caballero', cargo: 'Comercial y Ventas' },
        { nombre: 'Luis Mendoza', cargo: 'Analista de Control' },
        { nombre: 'Ignacio Valdivia', cargo: 'Marketing' },
        { nombre: 'Constanza Jimenez', cargo: 'Prevención de Riesgos' },
        { nombre: 'Bárbara Álvarez', cargo: 'Finanzas' },
        { nombre: 'Lisseth Vilchez', cargo: 'Administración' }
      ];
      var tonos = ['primario', 'ok', 'info', 'alerta', 'critico', 'hito', 'neutro'];

      var nav = ['Resumen:panel', 'Trabajo:tareas', 'Equipo:equipo', 'Archivos:carpeta', 'Seguimiento:bandera'].map(function (s, i) {
        var p = s.split(':');
        return '<button type="button" class="sx2-nav__item js-nav"' + (i === 0 ? ' aria-current="page"' : '') + '>' +
          U.ico(p[1], 16) + p[0] + (i === 1 ? '<span class="sx2-nav__contador">48</span>' : '') + '</button>';
      }).join('');

      var kpis = [
        { icono: 'capas', tono: 'primario', etiqueta: 'Total de tareas', valor: 48, unidad: 'tareas' },
        { icono: 'check', tono: 'ok', etiqueta: 'Completadas', valor: 10, unidad: 'tareas', tendencia: { texto: '21%', tono: 'ok' } },
        { icono: 'estado', tono: 'info', etiqueta: 'En curso', valor: 33, unidad: 'tareas', tendencia: { texto: '69%', tono: 'info' } },
        { icono: 'alerta', tono: 'critico', etiqueta: 'Atrasadas', valor: 4, unidad: 'tareas', tendencia: { texto: '8%', tono: 'critico' } },
        { icono: 'rayo', tono: 'alerta', etiqueta: 'En riesgo', valor: 1, unidad: 'tarea', tendencia: { texto: '2%', tono: 'alerta' } },
        { icono: 'diana', tono: 'ok', etiqueta: 'Cumplimiento de plazos', valor: 87, sufijo: '%', progreso: 87 }
      ].map(function (k, i) { k.i = i; k.filtro = 'k' + i; k.activo = i === 0; return U.kpi(k); }).join('');

      var filas = [
        ['Brochure', personas[1], 'Completada', 'ok', '28/08', '-2d', 'bien'],
        ['Presentación corporativa', personas[0], 'En curso', 'info', '15/09', '+3d', 'mal'],
        ['Campaña Meta', personas[2], 'Atrasada', 'critico', '30/09', '+5d', 'mal'],
        ['Videos testimonios', personas[3], 'Pendiente', 'neutro', '15/10', '0d', '']
      ].map(function (f) {
        return '<tr class="sx2-fila--clic js-abrir-drawer"><td><strong>' + U.esc(f[0]) + '</strong></td><td>' + U.persona(f[1]) + '</td>' +
          '<td>' + U.badge(f[2], f[3]) + '</td><td class="sx2-num">' + f[4] + '</td>' +
          '<td class="sx2-num' + (f[6] ? ' sx2-delta--' + f[6] : '') + '">' + f[5] + '</td></tr>';
      }).join('');

      document.getElementById('raiz').innerHTML =
        '<div class="sx2-pagina">' +
          '<header class="sx2-cabecera">' +
            '<div class="sx2-cabecera__txt">' +
              '<span class="sx2-cabecera__migas">Proyectos ' + U.ico('derecha', 12) + ' Estandarización de Dept. Comercial</span>' +
              '<h1>Sistema visual v2</h1><p>Contrato visual del piloto Proyectos v2 — todo se pinta con UIv2.</p>' +
            '</div>' +
            '<div class="sx2-cabecera__acciones">' +
              U.boton({ texto: 'Claro / oscuro', icono: 'luna', clase: 'js-tema' }) +
              U.boton({ texto: 'Exportar', icono: 'exportar' }) +
              U.boton({ texto: 'Nueva tarea', icono: 'nueva', variante: 'primario' }) +
            '</div>' +
          '</header>' +
          '<nav class="sx2-nav" aria-label="Secciones">' + nav + '</nav>' +
          '<div class="sx2-barra-filtros">' +
            '<label class="sx2-buscar">' + U.ico('lupa', 16) + '<input class="sx2-input" placeholder="Buscar tarea…" aria-label="Buscar tarea"></label>' +
            '<select class="sx2-select" aria-label="Responsable"><option>Responsable</option></select>' +
            '<select class="sx2-select" aria-label="Hito"><option>Hito</option></select>' +
            U.segmento([{ id: 'tabla', texto: 'Tabla', icono: 'tabla' }, { id: 'kanban', texto: 'Kanban', icono: 'kanban' }, { id: 'gantt', texto: 'Gantt', icono: 'gantt' }], 'gantt', 'js-seg') +
          '</div>' +
          '<div class="sx2-chips">' +
            U.chip({ texto: 'Todas', icono: 'filtro', n: 48, activo: true, clase: 'js-chip' }) +
            U.chip({ texto: 'Completadas', icono: 'check', tono: 'ok', n: 10, clase: 'js-chip' }) +
            U.chip({ texto: 'En curso', icono: 'estado', tono: 'info', n: 33, clase: 'js-chip' }) +
            U.chip({ texto: 'Atrasadas', icono: 'alerta', tono: 'critico', n: 4, clase: 'js-chip' }) +
            U.chip({ texto: 'En riesgo', icono: 'rayo', tono: 'alerta', n: 1, clase: 'js-chip' }) +
          '</div>' +
          '<div class="sx2-fila-kpis">' + kpis + '</div>' +
          '<div class="sx2-grid">' +
            '<div class="sx2-col-8">' + U.card({ titulo: 'Tabla de tareas', icono: 'tabla', sinRelleno: true, i: 1,
              accion: { texto: 'Ver todas' },
              cuerpo: '<div class="sx2-tabla-wrap"><table class="sx2-tabla"><thead><tr><th aria-sort="ascending">Tarea</th><th>Responsable</th><th>Estado</th><th class="sx2-num">Fin plan</th><th class="sx2-num">Desv.</th></tr></thead><tbody>' + filas + '</tbody></table></div>' }) + '</div>' +
            '<div class="sx2-col-4">' + U.card({ titulo: 'Avance del proyecto', icono: 'dona', i: 2,
              cuerpo: '<div class="sx2-entre"><div class="sx2-apilado" style="gap:10px;flex:1">' +
                '<span class="sx2-tenue">Real</span>' + U.barra(21, 'ok', true) +
                '<span class="sx2-tenue">Esperado</span>' + U.barra(17, 'neutro', true) + '</div>' +
                U.anillo(21, { tam: 96, grosor: 10, tono: 'ok' }) + '</div>' }) + '</div>' +
            '<div class="sx2-col-6">' + U.card({ titulo: 'Equipo', icono: 'equipo', sub: '6 personas', i: 3,
              cuerpo: '<ul class="sx2-lista">' + personas.slice(0, 4).map(function (p, i) {
                return '<li><span style="flex:1;min-width:0">' + U.persona(p) + '</span><span style="width:40%">' + U.barra([83, 75, 60, 45][i], 'primario') + '</span></li>';
              }).join('') + '</ul>' + '<div style="margin-top:12px">' + U.avatares(personas, 4) + '</div>' }) + '</div>' +
            '<div class="sx2-col-6">' + U.card({ titulo: 'Tonos y badges', icono: 'etiqueta', i: 4,
              cuerpo: '<div class="sg2-bloque"><div class="sg2-fila">' + tonos.map(function (t) { return U.badge(t, t); }).join('') + '</div>' +
                '<div class="sg2-fila">' + U.boton({ texto: 'Primario', variante: 'primario' }) + U.boton({ texto: 'Secundario' }) + U.boton({ texto: 'Fantasma', variante: 'fantasma' }) +
                U.boton({ texto: 'Chico', sm: true, icono: 'nueva' }) + U.boton({ soloIcono: true, icono: 'mas', titulo: 'Más' }) + '</div>' +
                '<div class="sg2-fila">' + [{ nombre: 'Juan Pérez' }].map(function (p) { return U.avatar(p, 'xs') + U.avatar(p, 'sm') + U.avatar(p) + U.avatar(p, 'lg') + U.avatar(p, 'xl'); }).join('') + '</div></div>' }) + '</div>' +
            '<div class="sx2-col-6">' + U.card({ titulo: 'Estado vacío', icono: 'caja', i: 5,
              cuerpo: U.vacio({ icono: 'tareas', titulo: 'Sin tareas todavía', texto: 'Crea la primera tarea del proyecto para empezar a planificar.', accion: U.boton({ texto: 'Nueva tarea', icono: 'nueva', variante: 'primario' }) }) }) + '</div>' +
            '<div class="sx2-col-6">' + U.card({ titulo: 'Cargando', icono: 'reloj', i: 6, cuerpo: U.esqueleto('tabla', 4) }) + '</div>' +
          '</div>' +
          '<div class="sx2-alertas sx2-entra" style="--i:7">' +
            '<span class="sx2-alertas__titulo sx2-tono-critico"><span class="sx2-kpi__ico">' + U.ico('alerta', 16) + '</span>Alertas del proyecto</span>' +
            '<span class="sx2-alertas__item sx2-tono-critico">' + U.ico('alerta', 15) + '4 tareas atrasadas</span>' +
            '<span class="sx2-alertas__item sx2-tono-alerta">' + U.ico('rayo', 15) + '1 tarea en riesgo</span>' +
            '<span class="sx2-alertas__item sx2-tono-ok">' + U.ico('check', 15) + '10 tareas completadas</span>' +
            '<span class="sx2-alertas__item sx2-tono-ok">' + U.ico('tendencia', 15) + '2 terminaron antes de plazo</span>' +
          '</div>' +
        '</div>';

      var raiz = document.getElementById('raiz');
      U.animar(raiz);

      raiz.addEventListener('click', function (ev) {
        var t = ev.target.closest('.js-tema');
        if (t) {
          var r = document.documentElement;
          r.setAttribute('data-tema', r.getAttribute('data-tema') === 'oscuro' ? 'claro' : 'oscuro');
          return;
        }
        var n = ev.target.closest('.js-nav');
        if (n) { raiz.querySelectorAll('.js-nav').forEach(function (b) { b.removeAttribute('aria-current'); }); n.setAttribute('aria-current', 'page'); return; }
        var s = ev.target.closest('.js-seg');
        if (s) { raiz.querySelectorAll('.js-seg').forEach(function (b) { b.setAttribute('aria-pressed', b === s ? 'true' : 'false'); }); return; }
        var c = ev.target.closest('.js-chip');
        if (c) { raiz.querySelectorAll('.js-chip').forEach(function (b) { b.setAttribute('aria-pressed', b === c ? 'true' : 'false'); }); return; }
        if (ev.target.closest('.js-abrir-drawer')) {
          U.drawer({
            titulo: 'Brochure',
            subtitulo: U.badge('Completada', 'ok'),
            cabeceraExtra: '<div class="sx2-tabs" role="tablist"><button class="sx2-tabs__op" role="tab" aria-selected="true">Detalle</button><button class="sx2-tabs__op" role="tab" aria-selected="false">Historial</button><button class="sx2-tabs__op" role="tab" aria-selected="false">Archivos</button></div>',
            cuerpo: '<div class="sx2-seccion-drawer"><h3 class="sx2-seccion-drawer__titulo">Responsable</h3>' + U.persona(personas[1], 'lg') + '</div>' +
              '<div class="sx2-seccion-drawer"><h3 class="sx2-seccion-drawer__titulo">Fechas</h3><dl class="sx2-dato"><dt>Planificada</dt><dd>01/08 – 28/08</dd><dt>Real</dt><dd>01/08 – 26/08</dd></dl></div>' +
              '<div class="sx2-seccion-drawer"><h3 class="sx2-seccion-drawer__titulo">Avance</h3>' + U.barra(100, 'ok', true) + '</div>',
            pie: U.boton({ texto: 'Actualizar tarea', icono: 'editar', variante: 'primario' })
          });
        }
      });
    })();
  </script>
</body>
</html>
