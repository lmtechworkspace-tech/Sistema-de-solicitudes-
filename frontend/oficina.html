<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SIGSO — Oficina virtual</title>
<style>
  :root { --tinta:#1b1f24; --suave:#5d6672; --borde:rgba(20,24,30,.09); --panel:rgba(255,255,255,.94); --sombra:0 10px 34px rgba(30,40,60,.13); }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; overflow:hidden; font-family:"Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color:var(--tinta); background:#e9eef2; -webkit-font-smoothing:antialiased; }
  #escena { position:fixed; inset:0; }
  button { font:inherit; }

  .barra { position:fixed; top:14px; left:14px; right:14px; display:flex; gap:10px; align-items:center; pointer-events:none; z-index:5; flex-wrap:wrap; }
  .barra > * { pointer-events:auto; }
  .marca { display:flex; align-items:center; gap:10px; background:var(--panel); backdrop-filter:blur(10px); border:1px solid var(--borde); border-radius:14px; padding:8px 14px 8px 9px; box-shadow:var(--sombra); }
  .logo { width:34px; height:34px; border-radius:10px; background:linear-gradient(135deg,#e9a23b,#c2410c); display:grid; place-items:center; color:#fff; font-weight:800; font-size:15px; }
  .marca b { display:block; font-size:14.5px; letter-spacing:-.01em; }
  .marca span { font-size:12px; color:var(--suave); }
  .grupo { display:flex; gap:4px; background:var(--panel); backdrop-filter:blur(10px); border:1px solid var(--borde); border-radius:14px; padding:4px; box-shadow:var(--sombra); }
  .btn { display:inline-flex; align-items:center; gap:7px; border:0; background:transparent; color:var(--tinta); border-radius:10px; padding:8px 12px; font-size:13.5px; font-weight:550; cursor:pointer; }
  .btn:hover { background:rgba(0,0,0,.05); }
  .btn.prim { background:var(--tinta); color:#fff; }
  .btn.prim:hover { background:#000; }
  .btn.on { background:#e6f1ff; color:#0b5cc2; }
  .estado { display:flex; gap:14px; background:var(--panel); backdrop-filter:blur(10px); border:1px solid var(--borde); border-radius:14px; padding:10px 14px; box-shadow:var(--sombra); font-size:12.5px; color:var(--suave); }
  .estado i { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px; animation:latido 2s infinite; }
  @keyframes latido { 50% { opacity:.35; } }
  .espacio { flex:1; }
  .aviso { font-size:12px; color:#8a5a00; background:#fff7e0; border:1px solid #f3dfa6; border-radius:10px; padding:7px 11px; }

  /* rótulos 3D */
  .rotulo { pointer-events:auto; cursor:pointer; display:flex; align-items:center; gap:7px; font-size:12.5px; font-weight:650; color:var(--tinta); background:rgba(255,255,255,.95); border:1px solid rgba(0,0,0,.07); border-radius:999px; padding:5px 11px 5px 9px; white-space:nowrap; box-shadow:0 4px 14px rgba(30,40,60,.14); transition:transform .2s, box-shadow .2s; }
  .rotulo::before { content:''; width:9px; height:9px; border-radius:50%; background:var(--c); box-shadow:0 0 0 3px color-mix(in srgb, var(--c) 22%, transparent); }
  .rotulo span { font-size:11px; font-weight:700; color:#fff; background:var(--c); border-radius:999px; padding:1px 7px; }
  .rotulo:hover, .rotulo.activo { transform:scale(1.08); box-shadow:0 6px 20px rgba(30,40,60,.22); }
  .rotulo.activo { outline:2px solid var(--c); }
  .nombre { pointer-events:auto; cursor:pointer; font-size:11px; font-weight:650; color:#fff; background:rgba(22,26,32,.82); border-radius:999px; padding:3px 9px 3px 6px; white-space:nowrap; display:flex; align-items:center; gap:5px; }
  .nombre i { width:7px; height:7px; border-radius:50%; }
  .nombre.activo { background:#fff; color:var(--tinta); box-shadow:0 0 0 2px #1b1f24; }
  .globo { pointer-events:none; max-width:180px; font-size:12px; line-height:1.3; color:var(--tinta); background:#fff; border-radius:12px; padding:7px 10px; box-shadow:0 6px 18px rgba(30,40,60,.18); opacity:0; transform:translateY(6px) scale(.9); transition:all .35s cubic-bezier(.2,.9,.3,1.3); position:relative; text-align:center; }
  .globo::after { content:''; position:absolute; left:50%; bottom:-6px; margin-left:-6px; border:6px solid transparent; border-bottom:0; border-top-color:#fff; }
  .globo.visible { opacity:1; transform:none; }

  /* panel */
  .panel { position:fixed; top:80px; right:14px; bottom:14px; width:min(410px, calc(100vw - 28px)); background:var(--panel); backdrop-filter:blur(14px); border:1px solid var(--borde); border-radius:20px; box-shadow:0 18px 50px rgba(30,40,60,.18); overflow:auto; transform:translateX(calc(100% + 30px)); transition:transform .45s cubic-bezier(.2,.8,.2,1); z-index:6; }
  .panel.abierto { transform:none; }
  .panel .cab { position:sticky; top:0; z-index:1; background:rgba(255,255,255,.97); padding:18px 18px 14px; border-bottom:1px solid var(--borde); display:flex; gap:12px; align-items:flex-start; }
  .panel .chip { width:14px; height:14px; border-radius:5px; margin-top:5px; flex:none; }
  .panel h2 { margin:0; font-size:19px; line-height:1.25; letter-spacing:-.015em; }
  .panel .cab small { color:var(--suave); font-size:12.5px; }
  .panel .cerrar { margin-left:auto; border:0; background:rgba(0,0,0,.05); width:30px; height:30px; border-radius:50%; font-size:18px; cursor:pointer; color:var(--suave); flex:none; }
  .panel .cuerpo { padding:6px 18px 24px; }
  .panel h3 { font-size:11.5px; letter-spacing:.07em; text-transform:uppercase; color:var(--suave); margin:20px 0 8px; }
  .panel p { margin:0; line-height:1.55; font-size:14px; }
  .etiquetas { display:flex; flex-wrap:wrap; gap:6px; }
  .etiquetas span { font-size:12.5px; background:#f1f3f5; border-radius:999px; padding:4px 10px; }
  .flujo { list-style:none; margin:0; padding:0; display:grid; gap:7px; }
  .flujo li { border:1px solid var(--borde); border-radius:12px; padding:9px 11px; font-size:13.5px; cursor:pointer; background:#fff; transition:border-color .2s, transform .2s; }
  .flujo li:hover { border-color:#b9c0c8; transform:translateX(2px); }
  .flujo .dir { font-size:11.5px; font-weight:700; margin-bottom:2px; }
  .flujo .canal { font-size:12px; color:var(--suave); margin-top:3px; }
  .flujo .canal::before { content:'💬 '; }
  .gente { display:grid; gap:7px; }
  .persona { display:flex; gap:11px; align-items:center; border:1px solid var(--borde); border-radius:12px; padding:9px 11px; cursor:pointer; background:#fff; text-align:left; color:inherit; width:100%; }
  .persona:hover { border-color:#b9c0c8; }
  .persona em { margin-left:auto; font-style:normal; font-size:12px; color:#0b5cc2; white-space:nowrap; }
  .avatar { width:36px; height:36px; border-radius:50%; display:grid; place-items:center; color:#fff; font-weight:700; font-size:13px; flex:none; }
  .avatar.grande { width:44px; height:44px; font-size:15px; }
  .persona b { display:block; font-size:14px; }
  .persona small { color:var(--suave); font-size:12.5px; }
  .lista { margin:0; padding-left:18px; font-size:14px; line-height:1.6; }
  .dato { display:grid; grid-template-columns:110px 1fr; gap:6px 10px; font-size:13.5px; margin:14px 0 0; }
  .dato dt { color:var(--suave); } .dato dd { margin:0; }
  .enlace { color:#0b5cc2; cursor:pointer; font-weight:550; }
  .volver { border:0; background:none; color:#0b5cc2; cursor:pointer; font-size:13px; padding:10px 0 4px; }
  .ahora { display:flex; align-items:center; gap:8px; font-size:13px; background:#f0fdf4; color:#166534; border-radius:10px; padding:8px 11px; margin-top:6px; }
  .ahora span { width:8px; height:8px; border-radius:50%; background:#16a34a; animation:latido 1.6s infinite; }
  .descriptor { margin-top:18px; border:1px solid var(--borde); border-radius:14px; padding:2px 14px 16px; background:linear-gradient(#fbfcfd, #fff); }
  .desc-cab { margin:12px 0 -6px; font-size:12px; font-weight:700; color:#0b5cc2; }

  /* recorrido */
  .tour { position:fixed; left:50%; bottom:20px; transform:translate(-50%, 20px); opacity:0; pointer-events:none; display:flex; gap:6px; align-items:center; background:var(--panel); backdrop-filter:blur(10px); border:1px solid var(--borde); border-radius:16px; padding:6px; box-shadow:var(--sombra); z-index:7; transition:all .35s; overflow:hidden; }
  .tour.activo { opacity:1; transform:translate(-50%, 0); pointer-events:auto; }
  .tour .paso { font-size:13px; min-width:190px; text-align:center; padding:0 6px; }
  .tour .paso b { color:var(--suave); margin-right:4px; }
  .tour .barrita { position:absolute; left:0; right:0; bottom:0; height:3px; background:rgba(0,0,0,.06); }
  .tour .barrita i { display:block; height:100%; width:0; background:var(--tinta); }
  .tip { position:fixed; pointer-events:none; background:var(--tinta); color:#fff; font-size:12.5px; padding:6px 10px; border-radius:9px; display:none; z-index:9; white-space:nowrap; }
  .ayuda { position:fixed; left:14px; bottom:14px; font-size:12px; color:var(--suave); background:var(--panel); border-radius:12px; padding:8px 12px; border:1px solid var(--borde); }
  .cargando { position:fixed; inset:0; display:grid; place-items:center; background:#e9eef2; z-index:20; font-size:14px; color:var(--suave); transition:opacity .6s; }
  .aviso:empty { display:none; }
  .aviso.real { color:#166534; background:#f0fdf4; border-color:#bbf7d0; }
  .volver-sigso { background:var(--panel); border:1px solid var(--borde); box-shadow:var(--sombra); text-decoration:none; }
  .sinof { background:#fff7e0; border:1px solid #f3dfa6; color:#8a5a00; box-shadow:var(--sombra); }
  .sinof span { background:#e9a23b; color:#fff; border-radius:999px; padding:0 7px; font-size:12px; }
  .ordenar { margin-top:14px; display:flex; flex-direction:column; gap:4px; font-size:13px; background:#f6f8fa; border-radius:12px; padding:10px 12px; }
  .ordenar select, .persona select { font:inherit; font-size:13px; border:1px solid var(--borde); border-radius:8px; padding:5px 8px; margin-left:6px; background:#fff; }
  .persona select { margin-left:auto; }
  .ordenar small { color:var(--suave); }
  .sin-desc { color:var(--suave); font-size:13.5px; margin-top:10px !important; }
  [hidden] { display:none !important; }
  /* fantasmas, control del mono, voz, búsqueda, minimapa */
  .nombre.fantasma { background:rgba(120,160,230,.75); }
  .pedir { display:flex; flex-wrap:wrap; gap:6px; margin:14px 0 4px; }
  .btn-pedir { font:inherit; font-size:13px; font-weight:600; border:0; border-radius:10px; padding:8px 12px; cursor:pointer; background:#eef4ff; color:#1e40af; }
  .btn-pedir:hover { background:#dbe7ff; }
  .enlace-pizarra { font:inherit; font-size:13px; border:1px solid var(--borde); background:#fff; border-radius:10px; padding:8px 12px; cursor:pointer; margin-top:6px; }
  .pend { border:1px solid var(--borde); border-radius:14px; padding:12px 14px; margin-top:12px; background:#fff; }
  .pend-cab { font-size:12px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--suave); }
  .pend-nums { display:grid; grid-template-columns:repeat(4, 1fr); gap:6px; margin-top:8px; }
  .pend-nums div { background:#f6f8fa; border-radius:10px; padding:8px 4px; text-align:center; }
  .pend-nums b { display:block; font-size:22px; } .pend-nums span { font-size:11px; color:var(--suave); }
  .pend-nums .rojo { background:#fef2f2; color:#b91c1c; } .pend-nums .ambar { background:#fffbeb; color:#b45309; }
  .pend-prox { font-size:13px; margin:10px 0 0 !important; }
  .pend-acc { display:flex; gap:6px; margin-top:10px; }
  .pend-acc button:first-child { font:inherit; font-size:13px; border:1px solid var(--borde); background:#fff; border-radius:10px; padding:8px 12px; cursor:pointer; }
  .pend-nota { font-size:12px !important; color:var(--suave); margin-top:14px !important; }
  .induccion { margin-top:14px; border-radius:12px; padding:10px 12px; background:#f6f8fa; font-size:13px; }
  .induccion p { font-size:13px !important; margin:4px 0 0 !important; }
  .induccion.ok { background:#f0fdf4; } .induccion.fin { background:#eef4ff; border:1px solid #c9dafc; margin-top:8px; }
  .induccion button { font:inherit; font-size:13px; font-weight:600; border:0; border-radius:10px; padding:9px 12px; margin-top:8px; cursor:pointer; background:#2563eb; color:#fff; }
  .induccion button:disabled { opacity:.7; cursor:default; }
  .nombre.envivo { background:#16a34a; color:#fff; font-size:12px; padding:4px 10px; box-shadow:0 0 0 3px rgba(22,163,74,.25); }
  .envivo-txt { color:#15803d; font-weight:650; }
  .interaccion .envivo-txt { color:#bbf7d0; font-size:11px; margin-left:4px; }
  .nombre.tu { background:#2563eb; color:#fff; font-size:12px; padding:4px 10px; box-shadow:0 0 0 3px rgba(37,99,235,.25); }
  .globo.hablando { background:#1b1f24; color:#fff; } .globo.hablando::after { border-top-color:#1b1f24; }
  .btn.mini { padding:8px 6px; margin-left:-4px; }
  #bMic.escuchando { background:#fee2e2; color:#b91c1c; animation:latido 1s infinite; }
  #bMover.on { background:#2563eb; color:#fff; }
  .fant { background:#eef4ff; border:1px solid #c9dafc; color:#1e40af; box-shadow:var(--sombra); }
  .buscador input { font:inherit; font-size:13px; width:220px; border:1px solid var(--borde); border-radius:12px; padding:9px 12px; background:var(--panel); box-shadow:var(--sombra); outline:none; }
  .buscador input:focus { border-color:#7fb3ec; box-shadow:0 0 0 3px rgba(37,99,235,.15); }
  .escuchar { border:0; background:rgba(0,0,0,.05); width:30px; height:30px; border-radius:50%; cursor:pointer; flex:none; margin-left:auto; }
  .escuchar + .cerrar { margin-left:0; }
  .chk { display:flex; align-items:center; gap:6px; font-size:13px; margin-top:6px; cursor:pointer; }
  .selector { font:inherit; font-size:13px; width:100%; border:1px solid var(--borde); border-radius:10px; padding:8px; background:#fff; }
  .ahora.fantasma { background:#eef4ff; color:#1e40af; } .ahora.fantasma span { background:#8fb6ff; }
  .ajustes-voz { position:fixed; top:66px; left:330px; z-index:9; background:#fff; border:1px solid var(--borde); border-radius:14px; box-shadow:var(--sombra); padding:12px; display:grid; gap:8px; width:290px; font-size:13px; }
  .ajustes-voz select, .ajustes-voz input { width:100%; font:inherit; }
  .ajustes-voz small { color:var(--suave); }
  .toast { position:fixed; left:50%; top:84px; transform:translate(-50%,-10px); opacity:0; pointer-events:none; z-index:8; background:rgba(27,31,36,.92); color:#fff; border-radius:14px; padding:10px 16px; max-width:min(520px,80vw); box-shadow:var(--sombra); transition:all .3s; text-align:center; }
  .toast.visible { opacity:1; transform:translate(-50%,0); }
  .toast b { display:block; font-size:14.5px; } .toast span { display:block; font-size:12.5px; opacity:.85; margin-top:2px; }
  .interaccion { position:fixed; left:50%; bottom:64px; transform:translateX(-50%); z-index:7; display:flex; gap:6px; }
  .interaccion button { font:inherit; font-size:13.5px; border:0; border-radius:12px; padding:9px 14px; cursor:pointer; background:#fff; box-shadow:var(--sombra); }
  .interaccion button[data-saludar] { background:#2563eb; color:#fff; }
  kbd { display:inline-block; font:600 11px/1 system-ui, sans-serif; border:1px solid rgba(0,0,0,.2); border-bottom-width:2px; border-radius:5px; padding:2px 5px; margin:0 2px; background:rgba(255,255,255,.85); color:#1b1f24; }
  .minimapa { position:fixed; left:14px; bottom:52px; z-index:5; background:rgba(255,255,255,.9); border:1px solid var(--borde); border-radius:12px; box-shadow:var(--sombra); padding:6px; cursor:pointer; }
  body.controlando .tour { display:none; }
  @media (max-width: 760px) { .aviso, .ayuda, .estado, .minimapa { display:none; } .panel { top:auto; height:56vh; } .buscador input { width:150px; } }
  @media (max-height: 640px) { .minimapa { display:none; } }
</style>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
               "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
</script>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/oficina/datos.js"></script>
</head>
<body>
<div id="escena"></div>
<div class="cargando" id="cargando">Armando la oficina…</div>

<div class="barra">
  <div class="marca"><div class="logo">H</div><div><b>Oficina virtual</b><span id="empresa"></span></div></div>
  <div class="grupo">
    <button class="btn prim" id="bTour">▶ Recorrido guiado</button>
    <button class="btn" id="bInduccion" title="Recorrido de inducción para quien llega: queda registrado en Calidad">🎓 Inducción</button>
    <button class="btn" id="bGeneral">⌂ Vista general</button>
    <button class="btn" id="bComu">⇄ Ver comunicaciones</button>
    <button class="btn" id="bMover" title="Tomar el control de tu mono (tecla M)">🎮 <span>Moverme</span></button>
    <button class="btn" id="bVoz">🔈 <span>Voz</span></button><button class="btn mini" id="bVozAjustes" title="Elegir voz y velocidad">▾</button>
    <button class="btn" id="bMic" title="Háblale a la oficina: «llévame a Prevención»">🎤</button>
  </div>
  <div class="estado" id="estado"></div>
  <div class="espacio"></div>
  <div class="buscador"><input id="buscar" list="sugerencias" placeholder="🔎 Buscar persona o área…" autocomplete="off"><datalist id="sugerencias"></datalist></div>
  <button class="btn sinof" id="bSinOficina" hidden>Personas sin oficina <span></span></button>
  <button class="btn fant" id="bFantasmas" hidden>👻 Fantasmas</button>
  <div class="aviso" id="aviso"></div>
  <a class="btn volver-sigso" id="volverSigso" href="plataforma.html" hidden>← Volver a SIGSO</a>
</div>

<aside class="panel" id="panel"></aside>

<div class="tour" id="tour">
  <button class="btn" id="tAnt" aria-label="Anterior">◀</button>
  <button class="btn" id="tPausa" aria-label="Pausa">❚❚</button>
  <div class="paso" id="tPaso"></div>
  <button class="btn" id="tSig" aria-label="Siguiente">▶</button>
  <button class="btn" id="tSalir">Salir</button>
  <div class="barrita"><i id="tBarra"></i></div>
</div>

<div class="tip" id="tip"></div>
<div class="ayuda" id="ayuda">Arrastra para girar · rueda para acercar · clic en una oficina o en una persona · <kbd>M</kbd> para moverte</div>
<div class="ajustes-voz" id="ajustesVoz" hidden>
  <label>Voz <select id="vozNombre"></select></label>
  <label>Velocidad <input id="vozVel" type="range" min="0.75" max="1.35" step="0.05"></label>
  <button class="btn prim" id="vozProbar">▶ Probar</button>
  <small>Las voces «Natural» o «Online» (Edge, Chrome) suenan más humanas.</small>
</div>
<div class="toast" id="toast"></div>
<div class="interaccion" id="interaccion" hidden></div>
<canvas class="minimapa" id="minimapa" title="Plano: haz clic en una sala"></canvas>

<script type="module">
  // Versión de la publicación (Pages agrega ?v=… a datos.js): los módulos 3D se
  // piden con la misma, para que nunca se mezcle esta página con módulos viejos en caché.
  const V = (document.querySelector('script[src*="oficina/datos.js"]').src.split('?')[1] || '');
  await import('./js/oficina/cargar.js' + (V ? '?' + V : ''));
  if (window.top === window) document.getElementById('volverSigso').hidden = false;
  const c = document.getElementById('cargando'); c.style.opacity = 0; setTimeout(() => c.remove(), 700);
</script>
</body>
</html>
