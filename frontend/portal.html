<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#17304F">
  <meta name="robots" content="noindex">
  <title>SIGSO · Portal de clientes de HomePymes</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2317304F'/%3E%3Ctext x='32' y='44' font-family='monospace' font-weight='700' font-size='34' fill='white' text-anchor='middle'%3ES%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500&display=swap">
  <!-- 2026-10-08: si el teléfono no logra bajar los estilos (señal débil, o justo
       mientras se publica una versión y guarda el «no encontrado» 10 min), se
       reintenta una vez con otra dirección; y mientras tanto la página se ve
       ordenada y usable, no con íconos gigantes. -->
  <style>
    html:not(.con-estilos) body { margin: 0; font: 17px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #EEF0F3; color: #141A24; }
    html:not(.con-estilos) #app { max-width: 460px; margin: 0 auto; padding: 16px; box-sizing: border-box; }
    html:not(.con-estilos) #app svg { width: 1.4em; height: 1.4em; vertical-align: middle; }
    html:not(.con-estilos) #app :is(input, button, textarea, select) { font: inherit; min-height: 44px; max-width: 100%; box-sizing: border-box; }
    html:not(.con-estilos) #app :is(input:not([type=checkbox]), textarea, select, button[type=submit]) { display: block; width: 100%; margin: 6px 0 14px; }
    html:not(.con-estilos) #app :is(label, em) { display: block; }
  </style>
  <link rel="stylesheet" href="css/portal-cliente.css?v=2026-10-08b" onload="document.documentElement.classList.add('con-estilos')" onerror="this.onerror=null;this.href='css/portal-cliente.css?r='+Date.now()">
</head>
<body>
  <!-- Portal de clientes (2026-10-07): la aplicación del contratista. Habla con el
       servidor por su propio canal (cliente_token, backend/logica/portalClientes.js);
       nada de la plataforma interna se carga aquí. -->
  <div class="app" id="app" aria-live="polite"><div class="cargando"><span class="rueda"></span>Cargando…</div></div>
  <div id="capa"></div>
  <script src="js/config.js"></script>
  <script src="js/portal-cliente.js?v=2026-10-08b" onerror="var s=document.createElement('script');s.src='js/portal-cliente.js?r='+Date.now();document.body.appendChild(s)"></script>
</body>
</html>
