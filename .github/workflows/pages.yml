name: Publicar frontend en GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "frontend/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4
      # D-005 (E1-1): si alguna vez se sube el config.js de desarrollo, el sitio público
      # (y el portal de los contratistas) apuntaría a la máquina de cada visitante. Se frena aquí.
      - name: Verificar que el frontend no apunte a una dirección local
        run: |
          if grep -nE "(localhost|127\.0\.0\.1|0\.0\.0\.0|\[::1\])" frontend/js/config.js; then
            echo "::error file=frontend/js/config.js::config.js apunta a una dirección local; no se publica."
            exit 1
          fi
      # Cada publicación cambia la versión de los archivos (?v=<commit>): sin esto el navegador puede seguir usando
      # el JS y el CSS que guardó y no se ven los cambios hasta forzar la recarga.
      - name: Versionar los JS y CSS de cada página
        run: |
          V="${GITHUB_SHA::8}"
          for f in frontend/*.html; do
            sed -i -E "s#((src|href)=\"(js|css|manuales)/[^\"?]+\.(js|css))\"#\1?v=${V}\"#g" "$f"
          done
          sed -i -E "s#^(  var VERSION = )'1';#\1'${V}';#" frontend/js/manual-v2.js
          grep -c "?v=${V}" frontend/plataforma.html
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Empaquetar solo frontend/ como sitio estatico
        uses: actions/upload-pages-artifact@v3
        with:
          path: "frontend"
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
