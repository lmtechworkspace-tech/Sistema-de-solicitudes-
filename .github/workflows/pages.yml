name: Publicar frontend en GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "frontend/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4
      # D-005 (E1-1): si alguna vez se sube el config.js de desarrollo, el sitio público
      # (y el portal de los contratistas) apuntaría a la máquina de cada visitante. Se frena aquí.
      - name: Verificar que el frontend no apunte a una dirección local
        run: |
          if grep -nE "(localhost|127\.0\.0\.1|0\.0\.0\.0|\[::1\])" frontend/js/config.js; then
            echo "::error file=frontend/js/config.js::config.js apunta a una dirección local; no se publica."
            exit 1
          fi
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Empaquetar solo frontend/ como sitio estatico
        uses: actions/upload-pages-artifact@v3
        with:
          path: "frontend"
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
