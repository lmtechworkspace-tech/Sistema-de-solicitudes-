name: Desplegar backend en el VPS

# Reemplaza el pegado manual del codigo en Apps Script: al hacer push a main
# con cambios del backend Node, se corren TODOS los tests y, solo si pasan, se
# sincroniza el codigo al VPS y se reinicia el servicio. Mismo modelo que el
# frontend (que ya se auto-publica en Pages), ahora tambien para el backend.

on:
  push:
    branches: ["main"]
    paths:
      - "backend/server/**"
      - "backend/db/**"
      - "backend/logica/**"
      - "backend/scripts/**"
      - "package.json"
      - ".github/workflows/deploy-backend.yml"
  # A proposito, backend/test/** NO esta en la lista: rsync (mas abajo)
  # nunca sincroniza tests al VPS, asi que un cambio solo-de-test no
  # necesita reiniciar el servicio. Trampa real (2026-09-21): si un push
  # de backend/logica/** falla la bateria de tests por algo AJENO al
  # cambio (ej. un fixture de fecha hardcodeada que vencio), y el arreglo
  # solo toca backend/test/**, ese arreglo NO retrigger-ea el pipeline por
  # su cuenta -- el commit de logica se queda sin desplegar hasta el
  # proximo push que SI toque un path de la lista, o un workflow_dispatch
  # manual. Quedo documentado aqui para no repetir la busqueda.
  workflow_dispatch:

concurrency:
  group: "deploy-backend"
  cancel-in-progress: false

jobs:
  probar-y-desplegar:
    runs-on: ubuntu-latest
    # SIGSO es un sistema chileno: toda su logica de fechas (jornada 09-18,
    # feriados, "hoy"/"dia futuro", cambio de hora) vive en America/Santiago.
    # CI corre por defecto en UTC, donde durante la ventana nocturna el "hoy"
    # local y el de Santiago difieren y algunos tests fallan. Dev, CI y el VPS
    # de produccion corren todos en la zona del negocio para que coincidan.
    env:
      TZ: America/Santiago
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Instalar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      # Antes de aws4fetch (activacion de R2) el proyecto tenia CERO
      # dependencias, asi que este paso no hacia falta. Sin el, un modulo
      # que haga require() de un paquete real revienta en CI (no hay
      # node_modules en un checkout limpio) y, si igual pasara, el VPS
      # tampoco lo tendria -- mismo tipo de trampa que backend/logica/
      # cuando se agrego como carpeta nueva al workflow (ver memoria).
      - name: Instalar dependencias
        run: npm ci

      # Puerta de seguridad: si UN solo test falla, el despliegue no ocurre.
      - name: Correr toda la bateria de tests
        run: node --test backend/test/*.test.js

      - name: Preparar la llave SSH de despliegue
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Sincronizar el codigo al VPS
        run: |
          rsync -az --delete -e "ssh -i ~/.ssh/deploy" \
            backend/server/ "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/sigso/backend/server/"
          rsync -az --delete -e "ssh -i ~/.ssh/deploy" \
            backend/db/ "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/sigso/backend/db/"
          rsync -az --delete -e "ssh -i ~/.ssh/deploy" \
            backend/logica/ "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/sigso/backend/logica/"
          rsync -az --delete -e "ssh -i ~/.ssh/deploy" \
            backend/scripts/ "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/sigso/backend/scripts/"
          scp -i ~/.ssh/deploy package.json package-lock.json \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/sigso/"
          # node_modules ya instalado y probado en este mismo job (npm ci
          # de arriba) se sincroniza tal cual -- el VPS nunca corre npm
          # install por su cuenta, ni depende de tener salida a internet en
          # el momento del despliegue.
          rsync -az --delete -e "ssh -i ~/.ssh/deploy" \
            node_modules/ "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/sigso/node_modules/"

      # Motor de PDF (R-3 de la auditoria de reportes): librerias del sistema +
      # chrome-headless-shell en la version que pide puppeteer-core. Idempotente
      # (si ya esta, termina en un segundo). No detiene el despliegue si falla:
      # sin Chromium el resto de SIGSO funciona y el PDF cae a "Imprimir".
      - name: Asegurar el motor de PDF (Chromium) en el VPS
        run: |
          ssh -i ~/.ssh/deploy "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            'bash /opt/sigso/backend/scripts/asegurar-chromium.sh' \
            || echo "::warning::No se pudo asegurar Chromium en el VPS; los PDF caen a Imprimir."

      - name: Reiniciar el servicio y verificar que responde
        run: |
          ssh -i ~/.ssh/deploy "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" '
            sudo systemctl restart sigso-api &&
            sleep 2 &&
            curl -fsS http://127.0.0.1:3000/v1/estado
          '
